name: Live check

# Calls every MCP tool against its real upstream and renders each MCP App.
# Hourly on main it checks every service: a check that exhausts its attempts is
# sent to Telegram, and again when it recovers.
# On every push it checks only the services changed or added under
# mcp/services/ (diffed against main) and just fails the run, with no alerts.
on:
  push:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:
    inputs:
      attempts:
        description: Attempts per failing tool (1–10)
        required: false
        default: "3"
      threshold:
        description: Failed runs in a row before a Telegram alert
        required: false
        default: "1"

concurrency:
  group: live-check-${{ github.event_name == 'push' && github.ref || 'scheduled' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  live-check:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      # Pushes to main diff against the previous main; other branches against where they left main.
      - name: Find changed services
        id: changed
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            base="$BEFORE"
            git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD~1
          else
            base=$(git merge-base origin/main HEAD)
          fi
          services=$(git diff --name-only "$base" HEAD -- mcp/services | cut -d/ -f3 | sort -u |
            while read -r id; do [ -f "mcp/services/$id/service.yaml" ] && echo "$id"; done | paste -sd, -)
          echo "Changed services since $base: ${services:-none}"
          echo "services=$services" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: github.event_name != 'push' || steps.changed.outputs.services != ''
      - run: bun install --frozen-lockfile
        if: github.event_name != 'push' || steps.changed.outputs.services != ''
      - run: bunx playwright install --with-deps chromium
        if: github.event_name != 'push' || steps.changed.outputs.services != ''

      - name: Live check changed services
        if: github.event_name == 'push' && steps.changed.outputs.services != ''
        run: bun run live-check --only "$SERVICES"
        env:
          SERVICES: ${{ steps.changed.outputs.services }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      # Failure counts carry over between runs in the Actions cache.
      - uses: actions/cache/restore@v6
        if: github.event_name != 'push'
        with:
          path: live-check-state.json
          key: live-check-state-${{ github.run_id }}
          restore-keys: live-check-state-

      - name: Live check all services
        if: github.event_name != 'push'
        run: bun run live-check --state live-check-state.json --threshold "$THRESHOLD" --attempts "$ATTEMPTS"
        env:
          ATTEMPTS: ${{ inputs.attempts || '3' }}
          THRESHOLD: ${{ inputs.threshold || '1' }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}

      - uses: actions/cache/save@v6
        if: always() && github.event_name != 'push' && hashFiles('live-check-state.json') != ''
        with:
          path: live-check-state.json
          key: live-check-state-${{ github.run_id }}

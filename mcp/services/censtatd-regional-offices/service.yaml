{
  "id": "censtatd-regional-offices",
  "title": "Companies with Parent Companies outside Hong Kong",
  "description": "C&SD regional headquarters, regional offices and local offices: counts, employment and parent locations.",
  "apis": [
    "API-0573",
    "API-0574",
    "API-0575"
  ],
  "datasets": [
    "hk-censtatd-tablechart-325-43001",
    "hk-censtatd-tablechart-325-43002",
    "hk-censtatd-tablechart-325-43011"
  ],
  "baseUrl": "https://www.censtatd.gov.hk/api",
  "lang": {
    "param": "lang",
    "map": {
      "en": "en",
      "tc": "tc",
      "sc": "sc"

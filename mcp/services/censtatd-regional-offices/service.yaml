  "cacheTtl": 3600,
  "tools": [
    {
      "name": "regional_office_counts",
      "title": "Number of regional headquarters, regional offices and local offices",
      "description": "Number of regional headquarters, regional offices and local offices. Official C&SD Table 325-43001. Latest years first, bounded local pagination via nextOffset. Source dimensions, units, rounding notes, flags and missing values are preserved. Overlapping categories and parent locations are not additive.",
      "path": "/get.php",
      "query": {
        "id": "325-43001",
        "full_series": 1
      },
      "transform": {
        "response": "normalize"
      },
      "input": {
        "period": {
          "type": "string",
          "pattern": "^\\d{4}$",
          "in": "local",
          "description": "Exact four-digit year."
        },
        "status": {
          "type": "string",
          "enum": [
            "LO",
            "RHQ",
            "RO",
            "RRL"
          ],
          "in": "local",
          "description": "LO local offices; RHQ regional headquarters; RO regional offices; RRL combined total. Totals overlap components; do not sum."
        },
        "measure": {
          "type": "string",
          "enum": [
            "count"
          ],
          "in": "local",
          "description": "Source count or percentage; never sum ratios with counts."
        },
        "limit": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 50,
          "in": "local"
        },
        "offset": {
          "type": "integer",
          "minimum": 0,
          "maximum": 100000,
          "default": 0,
          "in": "local"
        },
        "lang": {
          "type": "string",
          "enum": [
            "en",
            "tc",
            "sc"
          ],
          "default": "en"
        }
      }
    },

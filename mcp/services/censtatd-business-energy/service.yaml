tools:
  - name: service_business_receipts_indices
    title: Business receipts indices for service industries and service domains (quarterly average of
      2015 = 100) (660-69001)
    description: Business receipts indices for service industries and service domains (quarterly average
      of 2015 = 100). Official C&SD table 660-69001. Newest observations first; paginate with
      nextOffset. Figures and flags remain unchanged; empty figures are not zero. Totals and
      subgroups overlap; do not sum.
    path: /get.php
    query:
      id: 660-69001
      full_series: 1
    transform:
      response: normalizeBusinessEnergy
    input:
      freq:
        type: string
        in: local
        description: Official Y annual or Q quarterly frequency.
        enum:
          - Q
          - Y
      period:
        type: string
        in: local
        description: Four-digit year or exact YYYYMM quarter end where available; year matches all
          observations in that year.
        pattern: ^\d{4}(03|06|09|12)?$
      indicator:
        type: string
        in: local
        description: "Official statistical variables: BRI = Business receipts index (quarterly average of
          2015 = 100). Select with measure; preserve source units and notes."
        enum:
          - BRI
      measure:
        type: string
        in: local
        description: Normalized source unit; CR ratios are 0 to 1. No conversion or aggregation.
        enum:
          - index
      industry:
        type: string
        in: local
        description: "Official IND codes: ind_QBRI_45 = Import/export trade; ind_QBRI_46 = Wholesale;
          ind_QBRI_47 = Retail; ind_QBRI_49 = <i>Land transport<i>; ind_QBRI_49_50_51_522 =
          Transportation; ind_QBRI_521 = Warehousing and storage; ind_QBRI_532 = Courier;
          ind_QBRI_55 = Accommodation services; ind_QBRI_56 = Food services; ind_QBRI_591 = <i>Film
          entertainment<i>; ind_QBRI_61 = <i>Telecommunications<i>; ind_QBRI_6412_6413 = Banking;
          ind_QBRI_644_649_661_663 = Financing (except banking); ind_QBRI_65_662 = Insurance;
          ind_QBRI_AS = <i>Asset management<i>; ind_QBRI_AT = <i>Air transport<i>; ind_QBRI_CO =
          Computer and information technology services; ind_QBRI_FA = <i>Financial markets and asset
          management<i>; ind_QBRI_J = Information and communications; ind_QBRI_L = Real estate;
          ind_QBRI_M = Professional, scientific and technical services; ind_QBRI_N = Administrative
          and support services; ind_QBRI_TO = Tourism, convention and exhibition services;
          ind_QBRI_WT = <i>Water transport<i>. Source codes and labels are retained."
        enum:
          - ind_QBRI_45
          - ind_QBRI_46
          - ind_QBRI_47
          - ind_QBRI_49
          - ind_QBRI_49_50_51_522
          - ind_QBRI_521
          - ind_QBRI_532
          - ind_QBRI_55
          - ind_QBRI_56
          - ind_QBRI_591
          - ind_QBRI_61
          - ind_QBRI_6412_6413
          - ind_QBRI_644_649_661_663
          - ind_QBRI_65_662
          - ind_QBRI_AS
          - ind_QBRI_AT
          - ind_QBRI_CO
          - ind_QBRI_FA
          - ind_QBRI_J
          - ind_QBRI_L
          - ind_QBRI_M
          - ind_QBRI_N
          - ind_QBRI_TO
          - ind_QBRI_WT
      limit:
        type: integer
        in: local
        description: Maximum observations per page; also bounded to 100 KB of rows.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Continue using nextOffset with the same filters and language.
        default: 0
        minimum: 0
        maximum: 100000

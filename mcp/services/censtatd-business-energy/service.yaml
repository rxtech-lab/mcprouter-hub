  - name: industry_concentration_ratios
    title: Concentration ratios by selected industry grouping (660-76041)
    description: Concentration ratios by selected industry grouping. Official C&SD table 660-76041.
      Newest observations first; paginate with nextOffset. Figures and flags remain unchanged; empty
      figures are not zero. Totals and subgroups overlap; do not sum. CR(10), CR(20), CR(50) are
      ratios from 0 to 1, not percentages. Compare concentration over time; cross-industry
      comparisons depend on industry size.
    path: /get.php
    query:
      id: 660-76041
      full_series: 1
    transform:
      response: normalizeBusinessEnergy
    input:
      freq:
        type: string
        in: local
        description: Official Y annual or Q quarterly frequency.
        enum:
          - Y
      period:
        type: string
        in: local
        description: Four-digit year or exact YYYYMM quarter end where available; year matches all
          observations in that year.
        pattern: ^\d{4}$
      indicator:
        type: string
        in: local
        description: "Official statistical variables: CR = Concentration Ratios (CR); HC = Number of
          companies. Select with measure; preserve source units and notes."
        enum:
          - CR
          - HC
      measure:
        type: string
        in: local
        description: Normalized source unit; CR ratios are 0 to 1. No conversion or aggregation.
        enum:
          - cr10_ratio
          - cr20_ratio
          - cr50_ratio
          - number
      industry:
        type: string
        in: local
        description: "Official IND codes: ind_ASW_10-12 = Manufacturing of food, beverages and tobacco;
          ind_ASW_24_25_28-30_33 = Manufacturing of metal products, machinery and equipment;
          ind_ASW_37-39 = Sewerage, waste management and remediation activities; ind_ASW_41_42 =

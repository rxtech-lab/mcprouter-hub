id: censtatd-commerce-industry
title: Hong Kong Commerce & Industry Business Statistics
description: Official C&SD annual company performance tables for import/export, wholesale, retail,
  transportation, storage, courier, logistics, information and communications.
apis:
  - API-0717
  - API-0718
  - API-0719
  - API-0720
  - API-0721
  - API-0722
  - API-0723
  - API-0724
  - API-0728
  - API-0729
datasets:
  - hk-censtatd-tablechart-630-76003
  - hk-censtatd-tablechart-630-76004
  - hk-censtatd-tablechart-635-74002
  - hk-censtatd-tablechart-635-74003
  - hk-censtatd-tablechart-635-74004
  - hk-censtatd-tablechart-635-74005
  - hk-censtatd-tablechart-635-74008
  - hk-censtatd-tablechart-635-74009
  - hk-censtatd-tablechart-640-75101
  - hk-censtatd-tablechart-640-75102
baseUrl: https://www.censtatd.gov.hk/api
lang:
  param: lang
  map:
    en: en
    tc: tc
    sc: sc
cacheTtl: 3600
tools:
  - name: trades_statistics_by_receipts
    title: Principal statistics for all companies by industry grouping and total receipts
      (import/export, wholesale and retail trades sector) (630-76003)
    description: Principal statistics for all companies by industry grouping and total receipts
      (import/export, wholesale and retail trades sector). Official C&SD table 630-76003. Newest
      years first; paginate with nextOffset. Preserve source units, rounding, subsidy notes,
      suppression and revision flags. Totals and subgroups overlap; do not sum. Empty figures are
      not zero. Size groups differ between sectors.
    path: /get.php
    query:
      id: 630-76003
      full_series: 1
    transform:
      response: normalizeCommerceIndustry
    input:
      freq:
        type: string
        in: local
        description: Official annual frequency.
        enum:
          - Y
      period:
        type: string
        in: local
        description: Exact four-digit official year.
        pattern: ^\d{4}$
      indicator:
        type: string
        in: local
        description: "Official variables: COMP = Compensation of employees; COST_SOLD = Cost of goods sold;
          HC = Number of companies; IVA = Industry value added; OE = Operating expenses; PE_ASEA =
          Number of persons engaged; TR = Total receipts. Preserve original units and flags."
        enum:
          - COMP
          - COST_SOLD
          - HC
          - IVA
          - OE
          - PE_ASEA
          - TR
      measure:
        type: string
        in: local
        description: "Original units: HK$ million, number or year-on-year percent change. No conversion or
          aggregation."
        enum:
          - hkd_million
          - number
      industry:
        type: string
        in: local
        description: "Industry Grouping. Official IND codes and labels: ind_ASW_1_45_others = Other
          import/export trade; ind_ASW_1_46_others = Other wholesale trade; ind_ASW_1_47_others =
          Other retail trade; ind_ASW_45 = Import/export trade; ind_ASW_451201_4513_452201_4523 =
          Food, alcoholic drinks and tobacco; ind_ASW_451401-451405_452401-452405 = Clothing,
          footwear and allied products; ind_ASW_46 = Wholesale trade; ind_ASW_460201_4603 = Food,
          alcoholic drinks and tobacco; ind_ASW_460401-460405 = Clothing, footwear and allied
          products; ind_ASW_47 = Retail trade; ind_ASW_4711_4721-4723 = Food, alcoholic drinks and
          tobacco; ind_ASW_4731-4733 = Fuel; ind_ASW_475101-475104_475199_477101_477102_477199 =
          Clothing, footwear and allied products; ind_ASW_4773 = Transport equipment."
        enum:
          - ind_ASW_1_45_others
          - ind_ASW_1_46_others
          - ind_ASW_1_47_others
          - ind_ASW_45
          - ind_ASW_451201_4513_452201_4523
          - ind_ASW_451401-451405_452401-452405
          - ind_ASW_46
          - ind_ASW_460201_4603
          - ind_ASW_460401-460405
          - ind_ASW_47
          - ind_ASW_4711_4721-4723
          - ind_ASW_4731-4733
          - ind_ASW_475101-475104_475199_477101_477102_477199
          - ind_ASW_4773
      receipts_group:
        type: string
        in: local
        description: "Total Receipts (HK$ thousand). Official TR_GRP codes and labels: TOTAL = Total;
          1000-4999 = 1,000 - 4,999; 10000-19999 = 10,000 - 19,999; 20000-49999 = 20,000 - 49,999;
          5000-9999 = 5,000 - 9,999; 50000_and_over = ≥ 50,000; <1000 = < 1,000."
        enum:
          - TOTAL
          - 1000-4999
          - 10000-19999
          - 20000-49999
          - 5000-9999
          - 50000_and_over
          - <1000
      limit:
        type: integer
        in: local
        description: Maximum observations per page; also bounded to 100 KB.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Continue with nextOffset and the same filters and language.
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        description: Official title, labels, units and notes language.
        enum:
          - en
          - tc
          - sc
        default: en

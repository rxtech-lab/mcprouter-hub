id: censtatd-financial-markets
title: Hong Kong Mainland Investment, Money & Public Finance
description: Official C&SD Finance tables for outward direct investment in Mainland China, currency
  circulation, money supply, interest rates, exchange rates and government revenue and expenditure.
apis:
  - API-0571
  - API-0572
  - API-0596
  - API-0597
  - API-0598
  - API-0599
  - API-0600
  - API-0601
  - API-0602
  - API-0603
datasets:
  - hk-censtatd-tablechart-315-38031
  - hk-censtatd-tablechart-315-38032
  - hk-censtatd-tablechart-340-45001
  - hk-censtatd-tablechart-340-45011
  - hk-censtatd-tablechart-340-45012
  - hk-censtatd-tablechart-340-45021
  - hk-censtatd-tablechart-340-45022
  - hk-censtatd-tablechart-340-46001
  - hk-censtatd-tablechart-340-46002
  - hk-censtatd-tablechart-340-47001
baseUrl: https://www.censtatd.gov.hk/api
lang:
  param: lang
  map:
    en: en
    tc: tc
    sc: sc
cacheTtl: 3600
tools:
  - name: mainland_outward_di_regions
    title: Position and flow of outward direct investment (DI) in Chinese Mainland by region (315-38031)
    description: Position and flow of outward direct investment (DI) in Chinese Mainland by region. Official C&SD
      Table 315-38031. Newest observations first; paginate with nextOffset. Preserve original figures, units,
      missing values and revision flags. Totals overlap children; do not sum them.
    path: /get.php
    query:
      id: 315-38031
      full_series: 1
    transform:
      response: normalizeFinancialTable
    input:
      freq:
        type: string
        in: local
        description: Y annual; Q quarterly; M monthly. Only listed frequencies are supported.
        enum:
          - Y
      period:
        type: string
        in: local
        description: Four-digit provider year or exact YYYYMM period. A year matches all periods in that year; combine
          with freq for annual only.
        pattern: ^\d{4}$
      indicator:
        type: string
        in: local
        description: Original C&SD statistical variable code. Distinguishes position/flow, monetary aggregates, rates
          and revenue/expenditure.
        enum:
          - DI_OUTFLOW
          - DI_POS_ODI
      component:
        type: string
        in: local
        description: CG = Guangdong Province; CN = Chinese Mainland; NG = Places outside Guangdong Province
        enum:
          - CG
          - CN
          - NG
      measure:
        type: string
        in: local
        description: "Original units retained: amount_million/billion = HK$ million/billion; yoy = year-on-year
          percent change; interest_rate = percent per annum; exchange_rate = HK dollars per foreign unit;
          index = January 2020 base 100."
        enum:
          - amount_billion
      limit:
        type: integer
        in: local
        description: Maximum observations per page.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Offset after filtering. Continue with nextOffset using the same filters and language.
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        enum:
          - en
          - tc
          - sc
        default: en
        description: Language of official title, notes, units and dimension labels.

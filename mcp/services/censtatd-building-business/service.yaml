id: censtatd-building-business
title: Hong Kong Construction, Real Estate and Architectural Business Statistics
description: Official C&SD annual company, employment, receipts, expenses and value added statistics for construction, real estate, architectural, surveying and engineering services.
apis:
  - API-0687
  - API-0688
  - API-0689
  - API-0690
  - API-0691
  - API-0692
  - API-0693
  - API-0694
  - API-0695
  - API-0696
datasets:
  - hk-censtatd-tablechart-615-73002
  - hk-censtatd-tablechart-615-73003
  - hk-censtatd-tablechart-615-73011
  - hk-censtatd-tablechart-615-73012
  - hk-censtatd-tablechart-615-73013
  - hk-censtatd-tablechart-615-73021
  - hk-censtatd-tablechart-615-73031
  - hk-censtatd-tablechart-615-73032
  - hk-censtatd-tablechart-615-73051
  - hk-censtatd-tablechart-615-73052
baseUrl: https://www.censtatd.gov.hk/api
lang:
  param: lang
  map:
    en: en
    tc: tc
    sc: sc
cacheTtl: 3600
tools:
  - name: architecture_selected_statistics
    title: Selected statistics for all companies in the industry group of architectural, surveying and engineering services (615-73002)
    description: Selected statistics for all companies in the industry group of architectural, surveying and engineering services. Official C&SD Table 615-73002. Annual business performance statistics. Newest years first; paginate with nextOffset. Original figures, missing values, flags, units and localized notes are preserved. Do not sum overlapping industry groups and totals. Figures may not add up due to rounding. Subsidy qualifications are retained in source notes. Levels and year-on-year changes remain separate.
    path: /get.php
    query:
      id: 615-73002
      full_series: 1
    transform:
      response: normalizeBuildingBusiness
    input:
      period:
        type: string
        in: local
        description: Official annual period YYYY. Newest years appear first.
        pattern: ^\d{4}$
      freq:
        type: string
        in: local
        description: Annual observations.
        enum:
          - Y
      indicator:
        type: string
        in: local
        description: "Original variable codes: ASE_FEE = Architectural, surveying and engineering design and consultancy fees; BR_OTH = Other business receipts; COMP = Compensation of employees; CONSUM = Consumption of materials and supplies; fuels, electricity and water; and maintenance services; GS = Gross surplus; HC = Number of companies; IVA = Industry value added; MIS_EXP = Miscellaneous operating expenses; PE_ASEA = Number of persons engaged; SERV_INC = Service income. Growth rates use the same indicator with measure=yoy_percent where available."
        enum:
          - ASE_FEE
          - BR_OTH
          - COMP
          - CONSUM
          - GS
          - HC
          - IVA
          - MIS_EXP
          - PE_ASEA
          - SERV_INC
      industry:
        type: string
        in: local
        description: "IND: ind_ASBCRE_711 = Architectural, Surveying and Engineering Services Industry"
        enum:
          - ind_ASBCRE_711
      measure:
        type: string
        in: local
        description: hkd_million = HK$ million; number = count; yoy_percent = year-on-year percentage change. Preserve separate measures; no aggregation or conversion.
        enum:
          - hkd_million
          - number
      limit:
        type: integer
        in: local
        description: Maximum observations per page, also bounded to 100 KB of observation data.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Offset after filtering; continue with nextOffset and identical filters.
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        description: Official title, source, notes and dimension labels.
        enum:
          - en
          - tc
          - sc
        default: en

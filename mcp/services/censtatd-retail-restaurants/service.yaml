id: censtatd-retail-restaurants
title: Hong Kong Retail Sales and Restaurant Statistics
description: Official C&SD retail sales value and volume, online sales, supermarket and department store business performance, and restaurant receipts and purchases.
apis:
  - API-0697
  - API-0698
  - API-0699
  - API-0700
  - API-0701
  - API-0702
  - API-0703
  - API-0704
  - API-0705
  - API-0706
datasets:
  - hk-censtatd-tablechart-620-67001
  - hk-censtatd-tablechart-620-67002
  - hk-censtatd-tablechart-620-67003
  - hk-censtatd-tablechart-620-67011
  - hk-censtatd-tablechart-620-67012
  - hk-censtatd-tablechart-620-67021
  - hk-censtatd-tablechart-620-67031
  - hk-censtatd-tablechart-620-76011
  - hk-censtatd-tablechart-620-76012
  - hk-censtatd-tablechart-625-68001
baseUrl: https://www.censtatd.gov.hk/api
lang:
  param: lang
  map:
    en: en
    tc: tc
    sc: sc
cacheTtl: 3600
tools:
  - name: retail_sales_total
    title: Total retail sales (620-67001)
    description: "Total retail sales. Official C&SD Table 620-67001. Newest periods first; paginate with nextOffset. Original figures, missing values, flags, units and localized notes are preserved. Annual and subannual observations, values, volume indices, growth rates and shares remain separate. Do not sum overlapping groups. Index reference: October 2019–September 2020 = 100."
    path: /get.php
    query:
      id: 620-67001
      full_series: 1
    transform:
      response: normalizeRetailRestaurants
    input:
      period:
        type: string
        in: local
        description: Official YYYY or YYYYMM period; year prefix selects all its observations. Quarterly observations end in 03/06/09/12. Combine with freq to separate annual and subannual observations.
        pattern: ^\d{4}(0[1-9]|1[0-2])?$
      freq:
        type: string
        in: local
        description: Y annual; M monthly; Q quarterly, as available.
        enum:
          - M
          - Y
      indicator:
        type: string
        in: local
        description: "Original variable codes: VAL_IDX_RS = Value index of retail sales; VAL_RS = Value of retail sales; VOL_IDX_RS = Volume index of retail sales. Select measure to distinguish levels and changes."
        enum:
          - VAL_IDX_RS
          - VAL_RS
          - VOL_IDX_RS
      measure:
        type: string
        in: local
        description: hkd_million = HK$ million; number = count; index = reference-period index; yoy_percent = year-on-year change; three_month_change_percent = latest three months versus preceding three months; share_percent = share of total retail sales. No conversion or aggregation.
        enum:
          - hkd_million
          - index
          - yoy_percent
      limit:
        type: integer
        in: local
        description: Maximum observations per page; also bounded to 100 KB of observation data.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Offset after filtering; continue with nextOffset and identical filters.
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        description: Official title, source, notes and dimension labels.
        enum:
          - en
          - tc
          - sc
        default: en

  - name: restaurant_receipts_purchases
    title: Total restaurant receipts and restaurant purchases (625-68001)
    description: "Total restaurant receipts and restaurant purchases. Official C&SD Table 625-68001. Newest periods first; paginate with nextOffset. Original figures, missing values, flags, units and localized notes are preserved. Annual and subannual observations, values, volume indices, growth rates and shares remain separate. Do not sum overlapping groups. Index reference: October 2019–September 2020 = 100."
    path: /get.php
    query:
      id: 625-68001
      full_series: 1
    transform:
      response: normalizeRetailRestaurants
    input:
      period:
        type: string
        in: local
        description: Official YYYY or YYYYMM period; year prefix selects all its observations. Quarterly observations end in 03/06/09/12. Combine with freq to separate annual and subannual observations.
        pattern: ^\d{4}(03|06|09|12)?$
      freq:
        type: string
        in: local
        description: Y annual; M monthly; Q quarterly, as available.
        enum:
          - Q
          - Y
      indicator:
        type: string
        in: local
        description: "Original variable codes: VAL_IDX_RR = Value index of restaurant receipts; VAL_RP = Restaurant purchases; VAL_RR = Restaurant receipts; VOL_IDX_RR = Volume index of restaurant receipts. Select measure to distinguish levels and changes."
        enum:
          - VAL_IDX_RR
          - VAL_RP
          - VAL_RR
          - VOL_IDX_RR
      measure:
        type: string
        in: local
        description: hkd_million = HK$ million; number = count; index = reference-period index; yoy_percent = year-on-year change; three_month_change_percent = latest three months versus preceding three months; share_percent = share of total retail sales. No conversion or aggregation.
        enum:
          - hkd_million
          - index
          - yoy_percent
      limit:
        type: integer
        in: local
        description: Maximum observations per page; also bounded to 100 KB of observation data.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Offset after filtering; continue with nextOffset and identical filters.
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        description: Official title, source, notes and dimension labels.
        enum:
          - en
          - tc
          - sc
        default: en

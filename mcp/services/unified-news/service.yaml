id: unified-news
title: Global News
region: global
apis: [API-3820, API-3821]
description: Top news and article details from Trade Bloom Finance and Reuters API via RapidAPI, with provider-prefixed article IDs.
cacheTtl: 0
tools:
  - name: list_top_news
    title: Top news from both sources
    description: Return up to x unique article headlines from EACH of Trade Bloom Finance and Reuters API (up to 2x total). Preserve each provider's ranking and interleave the sources. Results contain durable provider-prefixed IDs for get_news_detail. Explicitly reports partial source failures and available counts; no automatic retries. Requires server RAPIDAPI_KEY and both RapidAPI subscriptions.
    handler: listTopNews
    input:
      x: { type: integer, minimum: 1, maximum: 50, default: 10, in: local, description: "Maximum articles per provider, not the combined total." }
  - name: get_news_detail
    title: News article details
    description: Fetch one article using the exact provider-prefixed id returned by list_top_news. trade-bloom IDs route to stories/detail by internalID; reuters IDs route to details by article URL. No prior list call or in-memory lookup is required. Returns id, provider and the provider's article data; content fields differ by source. Provider access restrictions are reported as errors, including failures inside HTTP 200 bodies.
    handler: getNewsDetail
    input:
      id: { type: string, required: true, in: local, pattern: '^(trade-bloom:[A-Za-z0-9]{14}|reuters:[A-Za-z0-9_-]{1,4000})$', description: Exact ID returned by list_top_news. }

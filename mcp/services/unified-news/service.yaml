id: unified-news
title: Global News
region: global
apis: [API-3820, API-3821, API-3822]
description: Top news and article details from Trade Bloom Finance and Reuters API via RapidAPI, plus the public Hacker News API, with provider-prefixed article IDs.
cacheTtl: 0
tools:
  - name: list_top_news
    title: Top news from three sources
    description: Return up to x unique article headlines from EACH of Trade Bloom Finance, Reuters API and Hacker News (up to 3x total). Preserve each provider's ranking and interleave the sources. Results contain durable provider-prefixed IDs for get_news_detail. Explicitly reports partial source failures and available counts; no automatic retries. Trade Bloom and Reuters require server RAPIDAPI_KEY and both RapidAPI subscriptions; Hacker News needs no key. Hacker News examines up to x ranked candidates and skips unavailable or non-story items.
    handler: listTopNews
    input:
      x: { type: integer, minimum: 1, maximum: 50, default: 10, in: local, description: "Maximum articles per provider, not the combined total." }
  - name: get_news_detail
    title: News article details
    description: Fetch one article using the exact provider-prefixed id returned by list_top_news. trade-bloom IDs route to stories/detail by internalID; reuters IDs route to details by article URL. hacker-news IDs route to the official Firebase item endpoint by numeric ID. No prior list call or in-memory lookup is required. Returns id, provider and the provider's article data; content fields differ by source. Provider access restrictions are reported as errors, including failures inside HTTP 200 bodies.
    handler: getNewsDetail
    input:
      id: { type: string, required: true, in: local, pattern: '^(trade-bloom:[A-Za-z0-9]{14}|reuters:[A-Za-z0-9_-]{1,4000}|hacker-news:[1-9][0-9]{0,15})$', description: Exact ID returned by list_top_news. }

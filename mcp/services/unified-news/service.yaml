id: unified-news
title: Global News
region: global
apis: [API-3820, API-3821, API-3822]
description: Top news, news search and article content from Trade Bloom Finance, Reuters, Hacker News and Firecrawl. Missing article bodies use a decision model and persistent Firecrawl scrape cache.
cacheTtl: 0
tools:
  - name: list_top_news
    title: Top news from three sources
    description: Return up to x unique article headlines from EACH of Trade Bloom Finance, Reuters API and Hacker News (up to 3x total). Preserve each provider's ranking and interleave the sources. Results contain durable provider-prefixed IDs for get_news_detail. Explicitly reports partial source failures and available counts; no automatic retries. Trade Bloom and Reuters require server RAPIDAPI_KEY and both RapidAPI subscriptions; Hacker News needs no key. Hacker News examines up to x ranked candidates and skips unavailable or non-story items.
    handler: listTopNews
    input:
      x: { type: integer, minimum: 1, maximum: 50, default: 10, in: local, description: "Maximum articles per provider, not the combined total." }
  - name: get_news_detail
    title: News article details
    description: Fetch article details using an exact id from list_top_news or search_news. Preserves provider article data. A decision model checks for an actual body; when missing, Firecrawl scrapes the linked page into content.markdown and saves it in the database for reuse. Firecrawl search IDs scrape directly. Reports provider, model, scrape and database failures explicitly; no automatic retries. Requires server AI Gateway configuration and FIRECRAWL_API_KEY for fallback.
    handler: getNewsDetail
    timeoutMs: 60000
    input:
      id: { type: string, required: true, in: local, pattern: '^(trade-bloom:[A-Za-z0-9]{14}|reuters:[A-Za-z0-9_-]{1,4000}|hacker-news:[1-9][0-9]{0,15}|firecrawl:[A-Za-z0-9_-]{1,4000})$', description: Exact ID returned by list_top_news or search_news. }
  - name: scrape_website
    title: Scrape website with Firecrawl
    description: Return main page content as Markdown using Firecrawl v2. Accepts a public HTTP(S) URL. Successful content is stored in the database and reused on later requests, including news details. Requires server FIRECRAWL_API_KEY. No automatic retries.
    handler: scrapeWebsite
    timeoutMs: 60000
    input:
      url: { type: string, required: true, in: local, description: Public article URL to scrape. }
  - name: search_news
    title: Search news with Firecrawl
    description: Search Firecrawl v2 with the news source. Returns ranked headlines, URLs, summaries and durable IDs for get_news_detail. Search does not scrape every result; request details to retrieve and cache a body. Requires server FIRECRAWL_API_KEY. No automatic retries.
    handler: searchNews
    timeoutMs: 60000
    input:
      query: { type: string, required: true, in: local, description: News search query containing 1 to 500 characters. }
      limit: { type: integer, minimum: 1, maximum: 50, default: 10, in: local, description: Maximum news results. }

      "title": "Village and market town boundaries 2019-2022",
      "description": "Village and market town boundaries 2019-2022. Read-only official CSDI feature records. Source fields, nulls and original languages are preserved; lang selects the name alias only. Boundaries are solely for rural representative elections in the named term, not for other purposes. Search one allowlisted field (default localized name); SQL LIKE % and _ are wildcards. At most 100 records and 100 KB per page; geometry above 20 KB is explicitly omitted, available at meta.source. Continue with nextOffset and identical filters. Shape__Area and Shape__Length retain source projected units, not WGS84 degrees.",
      "baseUrl": "https://portal.csdi.gov.hk",
      "path": "/server/rest/services/common/had_rcd_1699500451584_93029/FeatureServer/0/query",
      "input": {
        "search": {
          "type": "string",
          "pattern": "^.{1,100}$",
          "description": "Substring or SQL LIKE pattern in one published text field",
          "in": "local"
        },
        "searchField": {
          "type": "string",
          "enum": [
            "VIL_ENAME",
            "VIL_CNAME",
            "RCOM_ENAME",
            "RCOM_CNAME",
            "PLANNO"
          ],
          "description": "Allowlisted source field; defaults to name for lang",
          "in": "local"
        },
        "objectId": {
          "type": "integer",
          "minimum": 1,
          "maximum": 2147483647,
          "description": "Exact source OBJECTID",
          "in": "local"
        },
        "bbox": {
          "type": "string",
          "pattern": "^-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?$",
          "description": "WGS84 west,south,east,north; intersection",
          "in": "local"
        },
        "geometry": {
          "type": "boolean",
          "default": true,
          "name": "returnGeometry"
        },
        "lang": {
          "type": "string",
          "enum": [
            "en",
            "tc"
          ],
          "default": "en",
          "in": "local"
        },
        "limit": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20,
          "name": "resultRecordCount"
        },
        "offset": {
          "type": "integer",
          "minimum": 0,
          "maximum": 1000000,
          "default": 0,
          "name": "resultOffset"
        }
      },
      "transform": {
        "request": "request2027",
        "response": "response2027"
      },
      "response": {
        "format": "json"
      },
      "timeoutMs": 30000,
      "query": {
        "f": "json",
        "where": "1=1",
        "outFields": "*",
        "outSR": 4326,
        "orderByFields": "OBJECTID ASC",
        "geometryPrecision": 6
      }
    },

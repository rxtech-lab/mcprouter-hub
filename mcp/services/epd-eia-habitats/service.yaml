id: epd-eia-habitats
title: Habitat Maps from EIA Reports
description: Habitat Maps from EIA Reports with structured access to the
  official EPD/CSDI source.
apis:
  - API-1854
datasets:
  - hk-epd-tnteamhfer-habitat-from-eia-reports
cacheTtl: 3600
tools:
  - name: epd_eia_habitat_maps
    title: Habitat Maps from EIA Reports
    description: Habitat maps from EIA reports across 16 published habitat layers,
      including woodland, wetland, watercourses and SSSI. Search by report,
      district or habitat. Source report references are in English; no
      translations invented. Uses the verified official CSDI FeatureServer JSON
      query interface. Results bounded to 100 records and 100 KB; continue with
      nextOffset. Text searches use one field per request.
    handler: habitats
    timeoutMs: 30000
    input:
      search:
        type: string
        pattern: ^.{1,100}$
        description: Text in one searchField; SQL LIKE wildcards % and _ are supported
      searchField:
        type: string
        enum:
          - report
          - district
          - habitat
        description: Report reference (default), district or habitat; mapped to each
          layer’s published field
      objectId:
        type: integer
        minimum: 1
        description: Exact unique object ID (OBJECTID_1 for habitat layers 0 and 6;
          otherwise OBJECTID)
      bbox:
        type: string
        pattern: ^-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?$
        description: WGS84 west,south,east,north; spatial intersection
      geometry:
        type: boolean
        default: false
        description: Include WGS84 geometry; oversized geometry explicitly omitted
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        description: Maximum records; output also bounded to 100 KB
      offset:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
        description: Continue with nextOffset using identical filters
      lang:
        type: string
        enum:
          - en
        default: en
        description: Language of name; original multilingual attributes retained. Only
          published languages are supported
      habitat:
        type: string
        enum:
          - SeasonalWatercourse
          - woodland
          - Wetland
          - Watercourse
          - Wasteland
          - VillageArea
          - UplandGrassland
          - SSSI
          - Shrubland
          - Pond
          - Plantation
          - Marsh
          - GrasslandShrubland
          - Grassland
          - DevelopedArea
          - AgriculturalLand
        default: SeasonalWatercourse
        description: One of the 16 published habitat layers

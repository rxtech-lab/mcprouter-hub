id: fehd-centres
title: FEHD Exhibition and Resource Centres
description: FEHD Exhibition and Resource Centres with structured access to the
  official CSDI FeatureServer.
apis:
  - API-1899
datasets:
  - hk-fehd-fehderc-fehd-centres
cacheTtl: 3600
tools:
  - name: fehd_exhibition_resource_centres
    title: FEHD Exhibition and Resource Centres
    description: "FEHD Exhibition and Resource Centres. Query published attributes
      by one allowlisted searchField, exact objectId, or WGS84 bbox. Results
      bounded to 100 records and 100 KB; paginate using nextOffset. Original
      attributes retained; name follows lang. "
    handler: query
    timeoutMs: 30000
    input:
      search:
        type: string
        pattern: ^.{1,100}$
        description: Text in one searchField; SQL LIKE wildcards % and _ are supported
      searchField:
        type: string
        enum:
          - NameEN
          - NameTC
          - AddressEN
          - AddressTC
        description: One published field; defaults to the name in lang
      objectId:
        type: integer
        minimum: 1
        description: Exact source OBJECTID
      bbox:
        type: string
        pattern: ^-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?$
        description: WGS84 west,south,east,north; spatial intersection
      geometry:
        type: boolean
        default: false
        description: Include WGS84 geometry; oversized geometry explicitly omitted
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        description: Maximum records; output also bounded to 100 KB
      offset:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
        description: Continue with nextOffset using identical filters
      lang:
        type: string
        enum:
          - en
          - tc
        default: en
        description: Language of name; original multilingual attributes retained. Only
          published languages are supported

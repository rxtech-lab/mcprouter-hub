id: hyd-barrier-fence
title: Barrier Fences
description: Highways Department barrier fence identifiers, level relative to ground, source length and WGS84 polylines. Search by BF_UID or narrow by bounding box; paginate with nextOffset. Attributes are codes and numbers with no translated names.
apis: [API-1984]
datasets: [hk-hyd-csdi-barrier-fence]
cacheTtl: 86400
tools:
  - name: hyd_barrier_fences
    title: Barrier Fences
    description: Highways Department barrier fence identifiers, level relative to ground, source length and WGS84 polylines. Search by BF_UID or narrow by bounding box; paginate with nextOffset. Attributes are codes and numbers with no translated names. Results are bounded to 100 records and 100 KB; nextOffset continues the query. Search supports SQL LIKE wildcards (% and _).
    handler: query
    input:
      search: { type: string, pattern: '^.{1,100}$', description: "Text or code to find in published attributes" }
      objectId: { type: integer, minimum: 1, description: "Exact source OBJECTID" }
      bbox: { type: string, pattern: '^-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?$', description: "WGS84 west,south,east,north; spatial intersection" }
      geometry: { type: boolean, default: true, description: "Include coordinates or polyline; oversized geometry is omitted explicitly" }
      limit: { type: integer, minimum: 1, maximum: 100, default: 20, description: "Maximum records" }
      offset: { type: integer, minimum: 0, maximum: 1000000, default: 0, description: "Use nextOffset from previous result with the same filters" }

          - SECT_H11
          - SECT_H12
          - SECT_H13
          - SECT_H14
          - SECT_H2
          - SECT_I
          - SECT_I1
          - SECT_I2
          - SECT_J
          - SECT_J1
          - SECT_J2
          - SECT_K
          - SECT_K1
          - SECT_K2
          - SECT_L
          - SECT_LMN
          - SECT_MN
          - SECT_O
          - SECT_OWN
          - SECT_O_TO_T
          - SECT_P_TO_T
          - SERVICES
          - TOTAL
      measure:
        type: string
        in: local
        description: level = monetary amount (original svDesc distinguishes HK$ million and per capita HK$); yoy =
          year-on-year percent change; share = percent contribution to GDP; ratio = statistical discrepancy as
          percent of GDP.
        enum:
          - level
          - yoy
          - share
      limit:
        type: integer
        in: local
        description: Maximum observations per page.
        default: 50

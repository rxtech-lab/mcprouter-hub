id: censtatd-national-accounts
title: Hong Kong GDP by Activity & National Accounts
description: Official C&SD Finance tables for services trade in chained dollars, GDP by economic activity,
  production and income accounts, savings, net lending, real domestic income and national income per capita.
apis:
  - API-0541
  - API-0542
  - API-0543
  - API-0544
  - API-0545
  - API-0546
  - API-0547
  - API-0548
  - API-0549
  - API-0550
datasets:
  - hk-censtatd-tablechart-310-33042
  - hk-censtatd-tablechart-310-34101
  - hk-censtatd-tablechart-310-34102
  - hk-censtatd-tablechart-310-34201
  - hk-censtatd-tablechart-310-34401
  - hk-censtatd-tablechart-310-34402
  - hk-censtatd-tablechart-310-34403
  - hk-censtatd-tablechart-310-34501
  - hk-censtatd-tablechart-310-35091
  - hk-censtatd-tablechart-310-36201
baseUrl: https://www.censtatd.gov.hk/api
lang:
  param: lang
  map:
    en: en
    tc: tc
    sc: sc
cacheTtl: 3600
tools:
  - name: services_trade_components_chained
    title: Exports and imports of services by service component in chained (2024) dollars (310-33042)
    description: "Exports and imports of services by service component in chained (2024) dollars. Official C&SD
      Table 310-33042. Newest observations first; page using nextOffset. Preserve source figures, units and
      revision flags. Quarter codes end in 03, 06, 09 or 12. Components include overlapping totals and
      children; do not sum them. Chained-dollar components are non-additive. "
    path: /get.php
    query:
      id: 310-33042
      full_series: 1
    transform:
      response: normalizeNationalAccounts
    input:
      freq:
        type: string
        in: local
        description: "Observation frequency: Y annual, Q quarterly where available."
        enum:
          - Q
          - Y
      period:
        type: string
        in: local
        description: Four-digit year (matches all observations in that year), or an exact quarter where available
          (202503 = Q1).
        pattern: ^\d{4}(03|06|09|12)?$
      indicator:
        type: string
        in: local
        description: Official C&SD statistical variable code; units remain in svDesc. Filter measure separately for
          levels and changes.
        enum:
          - CON
      component:
        type: string
        in: local
        description: GDP_COMPONENT. TOTAL aliases an empty source code or a table without components. FINS_XS =
          Financial services; MANU_MS = Manufacturing services; MS = Imports of services; OS_FINS_MS =
          Financial services; OS_INS_MS = Insurance and pension services; OS_INS_XS = Insurance and pension
          services; OS_MS = Other services; OS_OTH_MS = Others; OS_OTH_XS = Others; OS_XS = Other services;
          TRANS_MS = Transport; TRANS_XS = Transport; TRA_MS = Travel; TRA_XS = Travel; XS = Exports of
          services
        enum:
          - FINS_XS
          - MANU_MS
          - MS
          - OS_FINS_MS
          - OS_INS_MS
          - OS_INS_XS
          - OS_MS
          - OS_OTH_MS
          - OS_OTH_XS
          - OS_XS
          - TRANS_MS
          - TRANS_XS
          - TRA_MS
          - TRA_XS
          - XS
      measure:
        type: string
        in: local
        description: level = monetary amount (original svDesc distinguishes HK$ million and per capita HK$); yoy =
          year-on-year percent change; share = percent contribution to GDP; ratio = statistical discrepancy as
          percent of GDP.
        enum:
          - level
          - yoy
      limit:
        type: integer
        in: local
        description: Maximum observations per page.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Observation offset after filtering; continue with nextOffset.
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        enum:
          - en
          - tc
          - sc
        default: en
        description: Language for official title, component descriptions, units and notes.

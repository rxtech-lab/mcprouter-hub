      component:
        type: string
        in: local
        description: ACTIVITY. TOTAL aliases an empty source code or a table without components. SECT_AB =
          Agriculture, fishing, mining and quarrying; SECT_C = Manufacturing; SECT_DE = Electricity, gas and
          water supply, and waste management; SECT_F = Construction; SECT_G = Import/export, wholesale and
          retail trades; SECT_G1 = Import and export trade; SECT_G2 = Wholesale and retail trades; SECT_G21 =
          Wholesale; SECT_G22 = Retail trade; SECT_H = Transportation, storage, postal and courier services;
          SECT_H1 = Transportation and storage; SECT_H11 = Land transport; SECT_H12 = Water transport;
          SECT_H13 = Air transport; SECT_H14 = Warehousing and other transportation services; SECT_H2 = Postal
          and courier services; SECT_I = Accommodation and food services; SECT_I1 = Accommodation services;
          SECT_I2 = Food and beverage services; SECT_J = Information and communications; SECT_J1 =
          Telecommunications; SECT_J2 = Other information and communications services; SECT_K = Financing and
          insurance; SECT_K1 = Financing; SECT_K2 = Insurance; SECT_L = Real estate; SECT_LMN = Real estate,
          professional and business services; SECT_MN = Professional and business services; SECT_O = Public

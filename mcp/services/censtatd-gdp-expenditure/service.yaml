id: censtatd-gdp-expenditure
title: Hong Kong Consumption, Investment & Services Trade
description: Official C&SD Finance tables for domestic consumption by commodity, government consumption by component and function, individual and collective consumption, fixed capital formation and services trade.
apis: [API-0531, API-0532, API-0533, API-0534, API-0535, API-0536, API-0537, API-0538, API-0539, API-0540]
datasets:
  - hk-censtatd-tablechart-310-31013
  - hk-censtatd-tablechart-310-31014
  - hk-censtatd-tablechart-310-31015
  - hk-censtatd-tablechart-310-32021
  - hk-censtatd-tablechart-310-32022
  - hk-censtatd-tablechart-310-32023
  - hk-censtatd-tablechart-310-32024
  - hk-censtatd-tablechart-310-32031
  - hk-censtatd-tablechart-310-32032
  - hk-censtatd-tablechart-310-33041
baseUrl: https://www.censtatd.gov.hk/api
lang:
  param: lang
  map: { en: en, tc: tc, sc: sc }
cacheTtl: 3600
tools:
  - name: cxdm_groups_current
    title: "Consumption expenditure in the domestic market (CXDM) by commodity and service group at current market prices (310-31013)"
    description: "Consumption expenditure in the domestic market (CXDM) by commodity and service group at current market prices. Official C&SD Table 310-31013. Newest observations first. Page with offset; preserve original figures, units, missing values and revision flags. Annual observations only. "
    path: /get.php
    query: { id: "310-31013", full_series: 1 }
    transform: { response: normalizeExpenditureTable }
    input:
      freq:
        type: string
        in: local
        description: "Observation frequency: Y annual, Q quarterly where available."
        enum: ["Y"]
      period:
        type: string
        in: local
        description: "A four-digit year or exact quarter (202503 = Q1) where available. A year matches all observations in that year."
        pattern: '^\d{4}$'
      indicator:
        type: string
        in: local
        description: "C&SD indicator: CUR current prices, CON chained dollars. Use measure to distinguish levels, growth and distributions."
        enum: ["CUR"]
      component:
        type: string
        in: local
        description: "CXDM = Consumption expenditure in the domestic market; CXDM1 = Food and non-alcoholic beverages; CXDM10 = Medical care and health expenses; CXDM11 = Transport and communication; CXDM12 = Recreation and entertainment; CXDM13 = Education; CXDM14 = Other services; CXDM2 = Alcoholic beverages; CXDM3 = Tobacco; CXDM4 = Clothing, footwear and other personal effects; CXDM5 = Rent, rates, water and housing maintenance charges; CXDM6 = Fuel and light; CXDM7 = Furniture, furnishings and household equipment; CXDM8 = Household operation; CXDM9 = Personal care"
        enum: ["CXDM", "CXDM1", "CXDM10", "CXDM11", "CXDM12", "CXDM13", "CXDM14", "CXDM2", "CXDM3", "CXDM4", "CXDM5", "CXDM6", "CXDM7", "CXDM8", "CXDM9"]
      measure:
        type: string
        in: local
        description: "level = HK$ million; yoy = year-on-year percent change; distribution = percentage share of the table total."
        enum: ["level", "yoy"]
      limit:
        type: integer
        in: local
        description: Maximum observations per page.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Observation offset after filtering; continue with nextOffset.
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        enum: [en, tc, sc]
        default: en
        description: Language for official titles, units, component descriptions and notes.

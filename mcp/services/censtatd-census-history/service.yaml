    {
      "name": "census_2006_ssbg",
      "title": "2006 Population By-census (Statistics and Boundaries of Small Street Block Groups)",
      "description": "2006 Population By-census (Statistics and Boundaries of Small Street Block Groups). Historical C&SD statistics and boundaries, not current population estimates. Original field codes, nulls, numeric strings and suppression markers (e.g. -) are preserved without coercion. Use the official catalogue data dictionary to interpret measures; Shape__Area/Shape__Length retain provider projected units. lang selects the name alias only. Query by objectId or WGS84 bbox; continue with nextOffset and identical filters. At most 100 records and 100 KB per page. Geometry is opt-in; polygons over 20 KB are omitted explicitly, with complete geometry available via meta.source. Source: https://data.gov.hk/en-data/dataset/hk-censtatd-census_geo-2006-population-bycensus-by-ssbg",
      "path": "/server/rest/services/common/censtatd_rcd_1635931306405_72167/FeatureServer/0/query",
      "query": {
        "f": "json",
        "where": "1=1",
        "outFields": "*",
        "outSR": 4326,
        "orderByFields": "OBJECTID ASC",
        "geometryPrecision": 6
      },
      "input": {
        "objectId": {
          "type": "integer",
          "minimum": 1,
          "maximum": 2147483647,
          "in": "local"
        },
        "bbox": {
          "type": "string",
          "pattern": "^-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?$",
          "in": "local",
          "description": "WGS84 west,south,east,north; polygon intersection."
        },
        "geometry": {
          "type": "boolean",
          "default": false,
          "name": "returnGeometry"
        },
        "lang": {
          "type": "string",
          "enum": [
            "en",
            "tc"
          ],
          "default": "en",
          "in": "local",
          "description": "Name alias only. Source publishes English and Traditional Chinese; no Simplified Chinese variant."
        },
        "limit": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 10,
          "name": "resultRecordCount"
        },
        "offset": {
          "type": "integer",
          "minimum": 0,
          "maximum": 1000000,
          "default": 0,
          "name": "resultOffset"
        }
      },
      "transform": {
        "request": "request0204",
        "response": "response0204"
      },
      "response": {
        "format": "json"
      },
      "timeoutMs": 30000
    },

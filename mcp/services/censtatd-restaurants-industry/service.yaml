id: censtatd-restaurants-industry
title: Hong Kong Restaurants and Industry Business Statistics
description: Official C&SD restaurant receipts and purchases, seasonal indices, accommodation and food
  services, import/export, wholesale and retail business performance.
apis:
  - API-0707
  - API-0708
  - API-0709
  - API-0710
  - API-0711
  - API-0712
  - API-0713
  - API-0714
  - API-0715
  - API-0716
datasets:
  - hk-censtatd-tablechart-625-68002
  - hk-censtatd-tablechart-625-68003
  - hk-censtatd-tablechart-625-68004
  - hk-censtatd-tablechart-625-68011
  - hk-censtatd-tablechart-625-76101
  - hk-censtatd-tablechart-625-76102
  - hk-censtatd-tablechart-625-76103
  - hk-censtatd-tablechart-625-76104
  - hk-censtatd-tablechart-630-76001
  - hk-censtatd-tablechart-630-76002
baseUrl: https://www.censtatd.gov.hk/api
lang:
  param: lang
  map:
    en: en
    tc: tc
    sc: sc
cacheTtl: 3600
tools:
  - name: restaurant_receipts_purchases_monthly
    title: Total restaurant receipts and restaurant purchases analysed by month (625-68002)
    description: "Total restaurant receipts and restaurant purchases analysed by month. Official C&SD Table
      625-68002. Newest periods first; paginate with nextOffset. Preserve original figures, missing or
      suppressed values, revision flags, units and localized notes. Do not sum overlapping totals or size
      groups. Index reference: October 2019–September 2020 = 100. "
    path: /get.php
    query:
      id: 625-68002
      full_series: 1
    transform:
      response: normalizeRestaurantsIndustry
    input:
      period:
        type: string
        in: local
        description: Official YYYY or YYYYMM period; year prefix selects all its observations. Quarterly observations
          end in 03/06/09/12. Combine with freq to separate annual and subannual observations.
        pattern: ^\d{4}(0[1-9]|1[0-2])?$
      freq:
        type: string
        in: local
        description: Y annual; M monthly; Q quarterly, as available.
        enum:
          - M
          - Y
      indicator:
        type: string
        in: local
        description: "Original variables: VAL_IDX_RR = Value index of restaurant receipts; VAL_RP = Restaurant
          purchases; VAL_RR = Restaurant receipts; VOL_IDX_RR = Volume index of restaurant receipts. Select
          measure to distinguish levels and changes."
        enum:
          - VAL_IDX_RR
          - VAL_RP
          - VAL_RR
          - VOL_IDX_RR
      measure:
        type: string
        in: local
        description: hkd_million = HK$ million; number = count; index = reference-period index; yoy_percent =
          year-on-year change; qoq_percent = seasonally adjusted quarter-to-quarter change. No conversion or
          aggregation.
        enum:
          - hkd_million
          - index
          - yoy_percent
      limit:
        type: integer
        in: local
        description: Maximum observations per page; also bounded to 100 KB of observation data.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Offset after filtering; continue with nextOffset and identical filters.
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        description: Official title, source, notes and dimension labels.
        enum:
          - en
          - tc
          - sc
        default: en

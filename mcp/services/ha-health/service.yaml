id: ha-health
title: Health Bureau and Hospital Authority directories and statistics
description: DHC Express, women wellness satellites, public clinic directories,
  specialist waiting times and service throughput.
apis:
  - API-1975
  - API-1976
  - API-0042
  - API-2439
  - API-2441
  - API-2445
  - API-2446
  - API-2448
datasets:
  - hk-hhb-hhbphcc-list-of-dhce
  - hk-hhb-hhbphcc-list-of-wws
  - hospital-hadata-sop-waiting-time
  - hospital-hadata-cmctr-facilities
  - hospital-hadata-health-care-facilities
  - hospital-hadata-service-ambulatory-community
  - hospital-hadata-service-cmctr
  - hospital-hadata-service-ipdp
baseUrl: https://www.ha.org.hk
cacheTtl: 3600
tools:
  - name: health_dhc_express
    title: DHC Express core centres
    description: DHC Express core centres. Official structured JSON download with
      source fields preserved; paginated, searchable and cached for one hour.
      Contact and location information; verify service availability with the
      provider.
    path: /
    input:
      lang:
        type: string
        enum:
          - en
          - tc
        default: en
        in: local
        description: Published response language. DHC Express and WWS publish English
          and Traditional Chinese only.
      search:
        type: string
        pattern: ^.{1,100}$
        in: local
        description: Case-insensitive text across source fields and localized contact
          details.
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        in: local
        description: Maximum rows; output also bounded to 80 KB.
      offset:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
        in: local
        description: Continue with nextOffset using the same filters.
    transform:
      request: request
      response: response

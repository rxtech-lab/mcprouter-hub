  - name: ha_healthcare_facilities
    title: Hospital Authority hospitals and outpatient clinics
    description: Hospital Authority hospitals and outpatient clinics. Official
      structured JSON download with source fields preserved; paginated,
      searchable and cached for one hour. Contact and location information;
      verify service availability with the provider.
    path: /
    input:
      lang:
        type: string
        enum:
          - en
          - tc
          - sc
        default: en
        in: local
        description: Response language
      search:
        type: string
        pattern: ^.{1,100}$
        in: local

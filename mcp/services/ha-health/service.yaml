      offset:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
        in: local
        description: Continue with nextOffset using the same filters.
      table:
        type: string
        enum:
          - facility-hosp
          - facility-sop
          - facility-fmc
        default: facility-hosp
        in: local
        description: "Published table: source filename without language or extension.
          hosp=hospitals, sop=specialist outpatient, fmc=family medicine."
    transform:
      request: request
      response: response
  - name: ha_ambulatory_community_throughput
    title: Ambulatory and community services throughput
    description: Ambulatory and community services throughput. Official structured
      JSON download with source fields preserved; paginated, searchable and
      cached for one hour. Select a source table and financial year. Preserve
      units and nulls; totals overlap detailed rows and must not be added
      together.
    path: /
    input:
      lang:
        type: string
        enum:
          - en
          - tc
          - sc
        default: en
        in: local
        description: Response language
      search:
        type: string
        pattern: ^.{1,100}$
        in: local
        description: Case-insensitive text across source fields and localized contact
          details.
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        in: local
        description: Maximum rows; output also bounded to 80 KB.
      offset:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
        in: local
        description: Continue with nextOffset using the same filters.
      table:
        type: string
        enum:
          - ae-attnd
          - ae-attnd-gender-age
          - sop-attnd
          - sop-attnd-age-gender
          - pc-attnd
          - pc-attnd-age-gender
          - ahop-attnd
          - ahop-attnd-age-gender
          - gdh-attnd
          - pdh-attnd
          - cns-visit
          - ahc-attnd
          - psyoutreach-attnd
          - rehab-palliative-care-attnd
        default: ae-attnd
        in: local
        description: "Published table: source filename without language or extension.
          attnd=attendances; age/gender=demographic breakdown; ip=inpatient;
          dp=day inpatient; OT=operating theatre; AH=allied health. Totals and
          breakdowns overlap; do not sum them."
      year:
        type: string
        pattern: ^20[0-9]{2}-[0-9]{2}$
        in: local
        description: Exact published financial year, e.g. 2024-25. Source units, nulls,
          categories and totals preserved.
    transform:
      request: request
      response: response

  - name: shipping_port_cargo_gba_city
    title: Port cargo throughput by GBA city (Table 410-55114)
    description: Hong Kong port cargo throughput with Greater Bay Area (GBA) cities (Shenzhen, Guangzhou, Dongguan, Foshan, Zhuhai, Huizhou, Zhongshan, Jiangmen, Zhaoqing, Macao and All GBA Cities) in '000 tonnes and year-on-year % change, annually and quarterly. Newest periods first.
    path: /get.php
    query: { id: "410-55114", full_series: 1 }
    transform: { response: normalizeShippingTable }
    input:
      freq:
        type: string
        in: local
        transform: upper
        enum: [Y, Q]
        description: "Frequency: Y = Annual, Q = Quarterly"
      period:
        type: string
        in: local
        pattern: ^\d{4}(\d{2})?$
        description: Year or quarter period to filter by, e.g. 2025 or 202606
      city:
        type: string
        in: local
        description: GBA city name or code to search for (English or Chinese), e.g. Shenzhen, Guangzhou, Macao, 深圳 or 631GBA_SZ
      lang:
        type: string
        enum: [en, tc, sc]
        default: en
        description: Response language
    response:
      root: dataSet
      filter: { freq: freq }
      search: { input: city, fields: [COUNTRY, COUNTRYDesc] }
      limit: 100

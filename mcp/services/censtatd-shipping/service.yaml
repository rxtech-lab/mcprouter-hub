  - name: shipping_port_cargo_seasonally_adjusted
    title: Seasonally adjusted port cargo change (Table 410-55113)
    description: Quarter-to-quarter percentage change of seasonally adjusted series of Hong Kong port cargo throughput, by direction (Total, Inward, Outward) and shipment type (Total, Direct Shipment, Transhipment). Newest quarters first.

      Official C&SD Table 340-95006. Newest observations first; paginate with nextOffset. Preserve
      figures, units, missing values and revision flags; do not sum overlapping totals and children.
      ADT_CGSE is 99 Tael Gold turnover in HK$ million; ADT_LLG is Loco London Gold turnover in US$
      million.
    path: /get.php
    query:
      id: 340-95006
      full_series: 1
    transform:
      response: normalizeGovernmentMarketTable
    input:
      freq:
        type: string
        in: local
        description: Y annual; Q quarterly; M monthly. Only listed frequencies are supported.
        enum:
          - Q
          - Y
      period:
        type: string
        in: local
        description: Four-digit provider year or exact YYYYMM period where available. A year matches all
          observations in that year; combine with freq.
        pattern: ^\d{4}(03|06|09|12)?$
      indicator:
        type: string
        in: local
        description: Original statistical variable code; select the series without combining amounts, currencies
          or counts. ADT_CGSE is 99 Tael Gold turnover in HK$ million; ADT_LLG is Loco London Gold
          turnover in US$ million.
        enum:
          - ADT_CGSE
          - ADT_LLG
      component:
        type: string
        in: local
        description: NONE = No component dimension
        enum:
          - NONE
      measure:
        type: string
        in: local
        description: "Original units: amount_million/billion = HK$ million/billion; rmb_billion = RMB billion;
          usd_million = US$ million; interest_rate = period average percent per annum; silver_hkd_10oz =
          HK$ per 10 oz; count = number; contracts = number of contracts."
        enum:
          - amount_million
          - usd_million
      limit:
        type: integer
        in: local
        description: Maximum observations per page.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Offset after filtering; continue with nextOffset and the same filters/language.
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        description: Language of official title, notes, units and dimension labels.
        enum:
          - en
          - tc
          - sc
        default: en

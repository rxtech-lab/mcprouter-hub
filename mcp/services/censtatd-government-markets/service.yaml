id: censtatd-government-markets
title: Hong Kong Government Accounts & Market Trading
description: Official C&SD Finance tables for quarterly government accounts, revenue and expenditure
  including funds, silver prices, interbank trading, Exchange Fund instruments, HKEX securities and
  derivatives, Stock Connect and gold turnover.
apis:
  - API-0604
  - API-0605
  - API-0606
  - API-0607
  - API-0608
  - API-0609
  - API-0610
  - API-0611
  - API-0612
  - API-0613
datasets:
  - hk-censtatd-tablechart-340-47002
  - hk-censtatd-tablechart-340-47011
  - hk-censtatd-tablechart-340-47012
  - hk-censtatd-tablechart-340-92002
  - hk-censtatd-tablechart-340-95001
  - hk-censtatd-tablechart-340-95002
  - hk-censtatd-tablechart-340-95003
  - hk-censtatd-tablechart-340-95004
  - hk-censtatd-tablechart-340-95005
  - hk-censtatd-tablechart-340-95006
baseUrl: https://www.censtatd.gov.hk/api
lang:
  param: lang
  map:
    en: en
    tc: tc
    sc: sc
cacheTtl: 3600
tools:
  - name: government_quarterly_revenue_expenditure
    title: Government revenue and expenditure under the General Revenue Account analysed by quarter (340-47002)
    description: Government revenue and expenditure under the General Revenue Account analysed by quarter.
      Official C&SD Table 340-47002. Newest observations first; paginate with nextOffset. Preserve
      figures, units, missing values and revision flags; do not sum overlapping totals and children.
      Calendar quarter codes end in 03/06/09/12; figures cover the quarter, not a cumulative annual
      total.
    path: /get.php
    query:
      id: 340-47002
      full_series: 1
    transform:
      response: normalizeGovernmentMarketTable
    input:
      freq:
        type: string
        in: local
        description: Y annual; Q quarterly; M monthly. Only listed frequencies are supported.
        enum:
          - Q
      period:
        type: string
        in: local
        description: Four-digit provider year or exact YYYYMM period where available. A year matches all
          observations in that year; combine with freq.
        pattern: ^\d{4}(03|06|09|12)?$
      indicator:
        type: string
        in: local
        description: Original statistical variable code; select the series without combining amounts, currencies
          or counts. Calendar quarter codes end in 03/06/09/12; figures cover the quarter, not a
          cumulative annual total.
        enum:
          - EXP_GRA
          - REV_GRA
      component:
        type: string
        in: local
        description: REV_1 = Direct taxes; REV_2 = Indirect taxes; REV_3 = Other revenue; REV_4 = Transfers from
          Funds; REV_5 = Total revenue; EXP_1 = Actual expenditure during the period; EXP_2 = Transfers
          to Funds; EXP_8 = Total expenditure on General Revenue Account
        enum:
          - EXP_1
          - EXP_2
          - EXP_8
          - REV_1
          - REV_2
          - REV_3
          - REV_4
          - REV_5
      measure:
        type: string
        in: local
        description: "Original units: amount_million/billion = HK$ million/billion; rmb_billion = RMB billion;
          usd_million = US$ million; interest_rate = period average percent per annum; silver_hkd_10oz =
          HK$ per 10 oz; count = number; contracts = number of contracts."
        enum:
          - amount_million
      limit:
        type: integer
        in: local
        description: Maximum observations per page.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Offset after filtering; continue with nextOffset and the same filters/language.
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        description: Language of official title, notes, units and dimension labels.
        enum:
          - en
          - tc
          - sc
        default: en

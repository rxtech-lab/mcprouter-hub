      "title": "Land-based non-institutional population aged 15 and over by District Council district, sex and marital status",
      "description": "Land-based non-institutional population aged 15 and over by District Council district, sex and marital status. Official Table 110-06814. Newest observations first; original figure, svDesc, dimensions and sd_value flags preserved; empty figures are not zero. measure uses English unit labels across languages. Totals overlap children; consult notes for definitions, survey exclusions, revisions and comparability. Source: https://data.gov.hk/en-data/dataset/hk-censtatd-tablechart-110-06814",
      "path": "/get.php",
      "query": {
        "id": "110-06814",
        "full_series": 1
      },
      "transform": {
        "response": "normalize"
      },
      "input": {
        "freq": {
          "type": "string",
          "enum": [
            "Y"
          ],
          "in": "local",
          "description": "Y annual; M monthly where published. Monthly birth table also contains annual totals; do not add the two."
        },
        "period": {
          "type": "string",
          "pattern": "^\\d{4}$",
          "in": "local",
          "description": "Source year YYYY or month YYYYMM. A year includes all matching annual and monthly records; use freq to select one."
        },
        "indicator": {
          "type": "string",
          "enum": [
            "PP15"
          ],
          "in": "local",
          "description": "Exact source statistical series code. Counts, rates, ratios and percentage changes are separate measures."
        },
        "measure": {
          "type": "string",
          "enum": [
            "No. ('000)",
            "Percentage share in respective sex and district (%)"
          ],
          "in": "local",
          "description": "English source unit label, stable across languages. Distinguishes levels and percentages for the same indicator."
        },
        "DC": {
          "type": "string",
          "enum": [
            "TOTAL",
            "A",
            "B",
            "C",
            "D",
            "E",
            "F",
            "G",
            "H",
            "J",
            "K",
            "L",
            "M",
            "N",
            "P",
            "Q",
            "R",
            "S",
            "T"
          ],
          "in": "local",
          "description": "Exact provider DC code as a string; TOTAL selects an explicit empty source code. An absent dimension is not a total. Source value types and labels are retained."
        },
        "MARITAL": {
          "type": "string",
          "enum": [
            "TOTAL",
            "1",
            "2.1",
            "2.2",
            "2.3"
          ],
          "in": "local",
          "description": "Exact provider MARITAL code as a string; TOTAL selects an explicit empty source code. An absent dimension is not a total. Source value types and labels are retained."
        },
        "SEX": {
          "type": "string",
          "enum": [
            "TOTAL",
            "F",
            "M"
          ],
          "in": "local",
          "description": "Exact provider SEX code as a string; TOTAL selects an explicit empty source code. An absent dimension is not a total. Source value types and labels are retained."
        },
        "limit": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20,
          "in": "local",
          "description": "Maximum rows per page, also bounded to 100 KB of records."
        },
        "offset": {
          "type": "integer",
          "minimum": 0,
          "maximum": 1000000,
          "default": 0,
          "in": "local",
          "description": "Continue with nextOffset and identical filters."
        },
        "lang": {
          "type": "string",
          "enum": [
            "en",
            "tc",
            "sc"
          ],
          "in": "local",
          "description": "Published source language; original descriptions, notes and source flags retained.",
          "default": "en"
        }
      },
      "timeoutMs": 30000
    },

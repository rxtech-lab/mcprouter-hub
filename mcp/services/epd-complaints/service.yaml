id: epd-complaints
title: Pollution Complaint Statistics
description: Pollution Complaint Statistics from the Environmental Protection Department, with bounded structured
  access to the official source.
apis:
- API-1842
datasets:
- hk-epd-ronteam-pollution-complaint-statistics
cacheTtl: 3600
tools:
- name: epd_pollution_complaint_statistics
  title: Pollution complaint statistics
  description: 'Pollution complaint statistics by district and year: air, noise, water, waste and miscellaneous
    complaints, totals and percentages. Search district or year; source attributes and reporting years are retained.
    This is the published historical dataset, not a current complaint intake feed. Uses the official CSDI ArcGIS
    query API. Results bounded to 100 records and 100 KB; continue with nextOffset. Text search uses one selectable
    published field per request.'
  handler: pollutionComplaintStatistics
  input:
    search:
      type: string
      pattern: ^.{1,100}$
      description: 'Text in searchField (default: localized name/address); SQL LIKE wildcards % and _ supported'
    objectId:
      type: integer
      minimum: 1
      description: Exact source OBJECTID
    bbox:
      type: string
      pattern: ^-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?$
      description: WGS84 west,south,east,north; spatial intersection
    geometry:
      type: boolean
      default: false
      description: Include WGS84 geometry; large geometries explicitly omitted
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
      description: Maximum records; output also bounded to 100 KB
    offset:
      type: integer
      minimum: 0
      maximum: 1000000
      default: 0
      description: Continue with nextOffset using identical filters
    lang:
      type: string
      enum:
      - en
      - tc
      default: en
      description: Language of name; source multilingual fields retained. Only published languages supported.
    searchField:
      type: string
      enum:
      - DistrictEN
      - DistrictTC
      - YearEN
      description: One published field to search; defaults to the name/address in lang. Query fields separately;
        CSDI rejects cross-field OR searches.
  timeoutMs: 30000

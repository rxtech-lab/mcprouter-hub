id: censtatd-construction-output
title: Hong Kong Construction Output and Industry Statistics
description: Official C&SD gross construction output in nominal, real and seasonally adjusted terms, with trade, end-use, activity and annual construction industry statistics.
apis:
  - API-0677
  - API-0678
  - API-0679
  - API-0680
  - API-0681
  - API-0682
  - API-0683
  - API-0684
  - API-0685
  - API-0686
datasets:
  - hk-censtatd-tablechart-615-66001
  - hk-censtatd-tablechart-615-66002
  - hk-censtatd-tablechart-615-66011
  - hk-censtatd-tablechart-615-66012
  - hk-censtatd-tablechart-615-66021
  - hk-censtatd-tablechart-615-66022
  - hk-censtatd-tablechart-615-66023
  - hk-censtatd-tablechart-615-66024
  - hk-censtatd-tablechart-615-66031
  - hk-censtatd-tablechart-615-73001
baseUrl: https://www.censtatd.gov.hk/api
lang:
  param: lang
  map: { en: en, tc: tc, sc: sc }
cacheTtl: 3600
tools:
  - name: construction_output
    title: "Gross value of construction works performed by main contractors (615-66001)"
    description: "Gross value of construction works performed by main contractors. Official C&SD Table 615-66001. Newest observations first; paginate with nextOffset and the same filters. Source figures, units, flags, missing values and localized notes are preserved. Nominal and real levels, growth rates and annual/quarterly observations must remain separate. Real levels use 2000 prices. Do not sum overlapping totals and groups."
    path: /get.php
    query: { id: "615-66001", full_series: 1 }
    transform: { response: normalizeConstructionOutput }
    input:
      period:
        type: string
        in: local
        description: Provider year YYYY or quarter YYYY03/06/09/12; a year selects all its observations. Combine with freq to distinguish annual and quarterly values.
        pattern: "^\\d{4}(03|06|09|12)?$"
      freq:
        type: string
        in: local
        description: "Provider frequency: Y annual; Q quarterly."
        enum: ["Q", "Y"]
      indicator:
        type: string
        in: local
        description: "Original variable code: NOM is nominal, REAL is at 2000 prices, SA is seasonally adjusted, SC is sub-contractor output. Annual industry codes retain their official meaning."
        enum: ["GVCW_NOM", "GVCW_REAL"]
      measure:
        type: string
        in: local
        description: "Source measure: hkd_million = HK$ million; yoy_percent = year-on-year percentage change; qoq_percent = quarter-to-quarter percentage change; number = count. No conversion or aggregation."
        enum: ["hkd_million", "yoy_percent"]
      limit: { type: integer, in: local, description: Maximum observations returned per page., default: 50, minimum: 1, maximum: 100 }
      offset: { type: integer, in: local, description: Offset after filtering; continue with nextOffset., default: 0, minimum: 0, maximum: 100000 }
      lang:
        type: string
        description: Language of official title, notes, source and dimension labels.
        enum: [en, tc, sc]
        default: en

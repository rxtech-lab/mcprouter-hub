    {
      "name": "landsd_old_survey_sheets_1",
      "title": "OldSurveySheet_OLD600_MapIndex",
      "description": "OldSurveySheet_OLD600_MapIndex: official Lands Department CSDI records. Preserve source fields, nulls, dates (epoch milliseconds), units and links. lang selects the name alias only; no automatic translation. Up to 100 rows / 100 KB, stable OBJECTID paging; geometry over 20 KB explicitly omitted. Continue with nextOffset and identical filters. Structured sheet index with edition dates and provider GeoTIFF download links; raster imagery is not decoded. Five series cover OLD600, T1200, 1960s–1970s, 1980s–1990s and 2000s.",
      "baseUrl": "https://portal.csdi.gov.hk",
      "path": "/server/rest/services/common/landsd_rcd_1631584892859_72892/FeatureServer/0/query",
      "input": {
        "search": {
          "type": "string",
          "pattern": "^.{1,100}$",
          "in": "local",
          "description": "Substring / SQL LIKE pattern (% and _ are wildcards)."
        },
        "searchField": {
          "type": "string",
          "enum": [
            "SHEETNO",
            "GeoTiff"
          ],
          "in": "local",
          "description": "Published field; default is localized name."
        },
        "objectId": {
          "type": "integer",
          "minimum": 1,
          "maximum": 2147483647,
          "in": "local"
        },
        "bbox": {
          "type": "string",
          "pattern": "^-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?$",
          "in": "local",
          "description": "WGS84 west,south,east,north; intersection."
        },
        "geometry": {
          "type": "boolean",
          "default": true,
          "name": "returnGeometry"
        },
        "lang": {
          "type": "string",
          "enum": [
            "en"
          ],
          "default": "en",
          "in": "local"
        },
        "limit": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20,
          "name": "resultRecordCount"
        },
        "offset": {
          "type": "integer",
          "minimum": 0,
          "maximum": 1000000,
          "default": 0,
          "name": "resultOffset"
        }
      },
      "query": {
        "f": "json",
        "where": "1=1",
        "outFields": "*",
        "outSR": 4326,
        "orderByFields": "OBJECTID ASC",
        "geometryPrecision": 6
      },
      "transform": {
        "request": "request31030",
        "response": "response31030"
      },
      "response": {
        "format": "json"
      },
      "timeoutMs": 30000
    },

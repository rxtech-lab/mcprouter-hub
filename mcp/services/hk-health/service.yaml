  - name: health_chinese_medicine_clinics
    title: Civil Service Chinese Medicine Clinics
    description: List of Civil Service Chinese Medicine Clinics, with official
      addresses and WGS84 point coordinates. Search names and addresses; page
      through the directory. Localizes name and address while retaining all
      published languages.
    baseUrl: https://portal.csdi.gov.hk
    path: /server/rest/services/common/csb_rcd_1699849584071_18909/FeatureServer/0/query
    query:
      f: json
      where: 1=1
      outFields: "*"
      outSR: 4326
      returnGeometry: true
      resultRecordCount: 100
      orderByFields: OBJECTID ASC
    input:
      limit:
        type: integer
        in: local
        default: 20
        minimum: 1
        maximum: 100
        description: Maximum records per page.
      offset:
        type: integer
        in: local
        default: 0
        minimum: 0
        maximum: 100000
        description: Offset after filtering; continue with nextOffset.
      search:
        type: string
        in: local
        pattern: ^.{1,100}$
        description: Case-insensitive substring across published source values.
      lang:
        type: string
        in: local
        enum:
          - en
          - tc
          - sc
        default: en
        description: Official language for tables and clinic names/addresses. Flu
          Express source columns remain English.
    transform:
      response: clinics
  - name: health_flu_express
    title: Flu Express weekly surveillance
    description: Flu Express weekly influenza surveillance figures from the
      Department of Health CSV download. Newest weeks first; filter year/week or
      source text. Source column names and values are preserved, including
      blanks for missing data. Proportion columns are source fractions, not
      percentages. No translated dataset is published.
    baseUrl: http://www.chp.gov.hk
    path: /files/misc/flux_data.csv
    input:
      limit:
        type: integer
        in: local
        default: 20
        minimum: 1
        maximum: 100
        description: Maximum records per page.
      offset:
        type: integer
        in: local
        default: 0
        minimum: 0
        maximum: 100000
        description: Offset after filtering; continue with nextOffset.
      search:
        type: string
        in: local
        pattern: ^.{1,100}$
        description: Case-insensitive substring across published source values.
      lang:
        type: string
        in: local
        enum:
          - en
          - tc
          - sc
        default: en
        description: Official language for tables and clinic names/addresses. Flu
          Express source columns remain English.
      year:
        type: integer
        in: local
        minimum: 2014
        maximum: 2100
      week:
        type: integer
        in: local
        minimum: 1
        maximum: 53
    response:
      format: text
    transform:
      response: flu

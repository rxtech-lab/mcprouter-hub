id: hk-health
title: Hong Kong Health Statistics & Clinics
description: Official C&SD HIV/AIDS, school immunisation and accident/emergency
  tables, CSB Chinese medicine clinics and DH Flu Express surveillance.
apis:
  - API-0847
  - API-0848
  - API-0849
  - API-1292
  - API-0044
datasets:
  - hk-censtatd-tablechart-930-92090
  - hk-censtatd-tablechart-930-92092
  - hk-censtatd-tablechart-930-92093
  - hk-csb-csb-spatial-chinese-medicine-clinics
  - hk-dh-chpsebcddr-flu-express
baseUrl: https://www.censtatd.gov.hk
cacheTtl: 3600
tools:
  - name: health_hiv_aids_by_sex
    title: Number of HIV infection and AIDS by sex
    description: Number of HIV infection and AIDS by sex. Official C&SD table
      930-92090. Newest first. Preserve source dimensions, units, missing
      values, flags and notes; do not sum overlapping totals. Filter by period,
      frequency, indicator or source text. School coverage years are academic
      years starting in September.
    path: /api/get.php
    query:
      id: 930-92090
      full_series: 1
    input:
      limit:
        type: integer
        in: local
        default: 20
        minimum: 1
        maximum: 100
        description: Maximum records per page.
      offset:
        type: integer
        in: local
        default: 0
        minimum: 0
        maximum: 100000
        description: Offset after filtering; continue with nextOffset.
      search:
        type: string
        in: local
        pattern: ^.{1,100}$
        description: Case-insensitive substring across published source values.
      lang:
        type: string
        in: query
        enum:
          - en
          - tc
          - sc
        default: en
        description: Official language for tables and clinic names/addresses. Flu
          Express source columns remain English.
      period:
        type: string
        in: local
        pattern: ^\d{4}(03|06|09|12)?$
        description: Year prefix or exact quarter code (03/06/09/12); school coverage
          years identify academic years.
      freq:
        type: string
        in: local
        enum:
          - Y
      indicator:
        type: string
        in: local
        enum:
          - NOTIFI_DISEASES
    transform:
      response: statistics

id: censtatd-investment
title: Hong Kong International Investment & External Debt
description: Official C&SD Finance tables for net investment flows by sector, international investment
  position, currency composition, external debt, and inward/outward direct investment by country and economic
  activity.
apis:
  - API-0561
  - API-0562
  - API-0563
  - API-0564
  - API-0565
  - API-0566
  - API-0567
  - API-0568
  - API-0569
  - API-0570
datasets:
  - hk-censtatd-tablechart-315-37006
  - hk-censtatd-tablechart-315-37021
  - hk-censtatd-tablechart-315-37022
  - hk-censtatd-tablechart-315-37023
  - hk-censtatd-tablechart-315-37031
  - hk-censtatd-tablechart-315-38001
  - hk-censtatd-tablechart-315-38011
  - hk-censtatd-tablechart-315-38012
  - hk-censtatd-tablechart-315-38021
  - hk-censtatd-tablechart-315-38022
baseUrl: https://www.censtatd.gov.hk/api
lang:
  param: lang
  map:
    en: en
    tc: tc
    sc: sc
cacheTtl: 3600
tools:
  - name: net_investment_flows_sector
    title: Net investment flows by sector (315-37006)
    description: Net investment flows by sector. Official C&SD Table 315-37006. Newest periods first; page with
      nextOffset. Original units, figures, missing values and revision flags are preserved. Position, flow and
      income are distinct statistical variables. Totals overlap their children; do not sum them. Amounts
      retain their source units; do not rescale or treat unavailable values as zero.
    path: /get.php
    query:
      id: 315-37006
      full_series: 1
    transform:
      response: normalizeInvestment
    input:
      freq:
        type: string
        in: local
        description: "Observation frequency: Y annual, Q quarterly where available."
        enum:
          - Q
          - Y
      period:
        type: string
        in: local
        description: Four-digit year, matching all observations in that year; quarterly tables also accept YYYY03,
          YYYY06, YYYY09 or YYYY12.
        pattern: ^\d{4}(03|06|09|12)?$
      indicator:
        type: string
        in: local
        description: "Official statistical variable: BOP. Position, transaction flows and income are separate series;
          retain svDesc units."
        enum:
          - BOP
      component:
        type: string
        in: local
        description: "BOP_COMPONENT codes: DI = Direct investment; DIB = Banks; DIO = Other sectors; FD = Financial
          derivatives; FDB = Banks; FDO = Other sectors; FNRA = Financial non-reserve assets; FNRB = Banks;
          FNRO = Other sectors; OI = Other investment; OIB = Banks; OIO = Other sectors; PI = Portfolio
          investment; PIB = Banks; PIO = Other sectors. Totals overlap children; do not sum them."
        enum:
          - DI
          - DIB
          - DIO
          - FD
          - FDB
          - FDO
          - FNRA
          - FNRB
          - FNRO
          - OI
          - OIB
          - OIO
          - PI
          - PIB
          - PIO
      measure:
        type: string
        in: local
        description: level = amount in the original svDesc unit (HK$ million or HK$ billion); ratio = percent of GDP.
          Never add amounts to ratios.
        enum:
          - level
      limit:
        type: integer
        in: local
        description: Maximum observations per page.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Observation offset after filtering; continue with nextOffset.
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        enum:
          - en
          - tc
          - sc
        default: en
        description: Language for the official title, dimension labels, units and notes.

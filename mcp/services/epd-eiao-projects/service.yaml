id: epd-eiao-projects
title: EIAO Project Applications
description: EIAO Project Applications with structured access to the official
  EPD/CSDI source.
apis:
  - API-1852
  - API-1853
datasets:
  - hk-epd-tnteameiao-dir
  - hk-epd-tnteameiao-eia
cacheTtl: 3600
tools:
  - name: epd_direct_environmental_permit_applications
    title: Direct environmental permit applications
    description: EIAO applications for permission to apply directly for an
      environmental permit. Returns application number, project titles,
      applicant, approval and permit status, and project website. Uses the
      verified official CSDI FeatureServer JSON query interface. Results bounded
      to 100 records and 100 KB; continue with nextOffset. Text searches use one
      field per request.
    handler: query1852
    timeoutMs: 30000
    input:
      search:
        type: string
        pattern: ^.{1,100}$
        description: Text in one searchField; SQL LIKE wildcards % and _ are supported
      searchField:
        type: string
        enum:
          - Title_of_t
          - Chinese_Ti
          - Applicatio
          - Name_of_th
          - Dir_Applic
          - EP_status
        description: One published field; defaults to the name in lang
      objectId:
        type: integer
        minimum: 1
        description: Exact unique object ID (OBJECTID_1 for habitat layers 0 and 6;
          otherwise OBJECTID)
      bbox:
        type: string
        pattern: ^-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?$
        description: WGS84 west,south,east,north; spatial intersection
      geometry:
        type: boolean
        default: false
        description: Include WGS84 geometry; oversized geometry explicitly omitted
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        description: Maximum records; output also bounded to 100 KB
      offset:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
        description: Continue with nextOffset using identical filters
      lang:
        type: string
        enum:
          - en
          - tc
        default: en
        description: Language of name; original multilingual attributes retained. Only
          published languages are supported
  - name: epd_eia_report_applications
    title: EIA report approval applications
    description: EIAO applications for approval of an Environmental Impact
      Assessment report. Returns application and register numbers, bilingual
      project titles, applicant, approval status, and project website. Uses the
      verified official CSDI FeatureServer JSON query interface. Results bounded
      to 100 records and 100 KB; continue with nextOffset. Text searches use one
      field per request.
    handler: query1853
    timeoutMs: 30000
    input:
      search:
        type: string
        pattern: ^.{1,100}$
        description: Text in one searchField; SQL LIKE wildcards % and _ are supported
      searchField:
        type: string
        enum:
          - Title_of_t
          - Chinese_Ti
          - Applicatio
          - Name_of_th
          - Register_N
          - EIA_Applic
        description: One published field; defaults to the name in lang
      objectId:
        type: integer
        minimum: 1
        description: Exact unique object ID (OBJECTID_1 for habitat layers 0 and 6;
          otherwise OBJECTID)
      bbox:
        type: string
        pattern: ^-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?$
        description: WGS84 west,south,east,north; spatial intersection
      geometry:
        type: boolean
        default: false
        description: Include WGS84 geometry; oversized geometry explicitly omitted
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        description: Maximum records; output also bounded to 100 KB
      offset:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
        description: Continue with nextOffset using identical filters
      lang:
        type: string
        enum:
          - en
          - tc
        default: en
        description: Language of name; original multilingual attributes retained. Only
          published languages are supported

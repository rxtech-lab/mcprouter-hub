id: censtatd-energy
title: Hong Kong Energy Trade, Storage, Sales & Consumption
description: Official C&SD oil and coal import unit values, net imports, stocks,
  sales, trade partners, electricity and gas consumption and revenue.
apis:
  - API-0816
  - API-0817
  - API-0818
  - API-0819
  - API-0820
  - API-0821
  - API-0822
  - API-0823
  - API-0824
  - API-0825
datasets:
  - hk-censtatd-tablechart-915-91103
  - hk-censtatd-tablechart-915-91104
  - hk-censtatd-tablechart-915-91105
  - hk-censtatd-tablechart-915-91106
  - hk-censtatd-tablechart-915-91107
  - hk-censtatd-tablechart-915-91108
  - hk-censtatd-tablechart-915-91109
  - hk-censtatd-tablechart-915-91110
  - hk-censtatd-tablechart-915-91201
  - hk-censtatd-tablechart-915-91202
baseUrl: https://www.censtatd.gov.hk/api
lang:
  param: lang
  map:
    en: en
    tc: tc
    sc: sc
cacheTtl: 3600
tools:
  - name: energy_import_unit_values
    title: Unit values of imports of oil products and coal products (915-91103)
    description: Unit values of imports of oil products and coal products. Official
      C&SD table 915-91103. Newest observations first; paginate with nextOffset.
      Original figures, units, flags and notes are preserved; empty values are
      not zero. Totals and subgroups overlap; do not sum.
    path: /get.php
    query:
      id: 915-91103
      full_series: 1
    transform:
      response: normalizeEnergy
    input:
      freq:
        type: string
        in: local
        description: Official annual Y, quarterly Q or monthly M frequency where available.
        enum:
          - Q
          - Y
      period:
        type: string
        in: local
        description: Four-digit year matches all observations in that year; otherwise
          exact YYYYMM period.
        pattern: ^\d{4}(03|06|09|12)?$
      indicator:
        type: string
        in: local
        description: "Official statistical variable code: UNIT_VAL_IM"
        enum:
          - UNIT_VAL_IM
      measure:
        type: string
        in: local
        description: Source unit, without conversion. Percentage shares and percentages
          remain distinct.
        enum:
          - hkd_per_kg
          - hkd_per_litre
          - hkd_per_tonne
      product:
        type: string
        in: local
        description: "Official PROD_TYPE codes: 1 = Aviation gasoline and kerosene; 2b =
          Motor gasoline (unleaded petrol); 3 = Gas oil, diesel oil and naphtha;
          4 = Fuel oil; 6 = Liquefied petroleum gas; 7 = Natural gas; 10 =
          Anthracite; 8 = Steam coal and other coal; 9 = Wood charcoal. TOTAL
          means the explicit source total; absent categories are not totals."
        enum:
          - "1"
          - "10"
          - 2b
          - "3"
          - "4"
          - "6"
          - "7"
          - "8"
          - "9"
      limit:
        type: integer
        in: local
        description: Maximum observations per page; also bounded to 100 KB of rows.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Continue using nextOffset with the same filters and language.
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        description: Language of official title, labels, units and notes.
        enum:
          - en
          - tc
          - sc
        default: en

    title: Local consumption of electricity and gas by type of users and sales
      revenue from locally sold (915-91202)
    description: Local consumption of electricity and gas by type of users and sales
      revenue from locally sold. Official C&SD table 915-91202. Newest
      observations first; paginate with nextOffset. Original figures, units,
      flags and notes are preserved; empty values are not zero. Totals and
      subgroups overlap; do not sum.
    path: /get.php
    query:
      id: 915-91202
      full_series: 1
    transform:
      response: normalizeEnergy
    input:
      freq:
        type: string
        in: local
        description: Official annual Y, quarterly Q or monthly M frequency where available.
        enum:
          - Q
          - Y
      period:
        type: string
        in: local
        description: Four-digit year matches all observations in that year; otherwise
          exact YYYYMM period.
        pattern: ^\d{4}(03|06|09|12)?$
      indicator:
        type: string
        in: local
        description: "Official statistical variable code: ELEC_LOCAL; REVENUE_ELEC;
          GASC_LOCAL; REVENUE_GAS"
        enum:
          - ELEC_LOCAL
          - REVENUE_ELEC
          - GASC_LOCAL
          - REVENUE_GAS
      measure:
        type: string
        in: local
        description: Source unit, without conversion. Percentage shares and percentages
          remain distinct.
        enum:
          - hkd_million
          - percent_share
          - terajoule
      user:
        type: string
        in: local
        description: "Official USER_TYPE codes: TOTAL = Total; 1 = Domestic; 2 =
          Commercial; 3 = Industrial; 4 = Street lighting. TOTAL means the
          explicit source total; absent categories are not totals."
        enum:
          - TOTAL
          - "1"
          - "2"
          - "3"
          - "4"
      limit:
        type: integer
        in: local
        description: Maximum observations per page; also bounded to 100 KB of rows.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Continue using nextOffset with the same filters and language.
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        description: Language of official title, labels, units and notes.
        enum:
          - en
          - tc
          - sc
        default: en

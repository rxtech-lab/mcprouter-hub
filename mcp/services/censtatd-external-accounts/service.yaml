  - name: current_account_seasonal_changes
    title: Percentage changes of seasonally adjusted current account (315-37005)
    description: Percentage changes of seasonally adjusted current account. Official C&SD Table 315-37005. Newest
      periods first; page with nextOffset. Preserve original units, figures, missing values and revision
      flags. Components include overlapping totals and children; do not sum them. Seasonally adjusted
      quarter-to-quarter percent changes, not annual growth.
    path: /get.php
    query:
      id: 315-37005
      full_series: 1
    transform:
      response: normalizeExternalAccounts
    input:
      freq:
        type: string
        in: local
        description: "Observation frequency: Y annual, Q quarterly where available."
        enum:
          - Q
      period:
        type: string
        in: local
        description: Four-digit year (matches all observations in that year), or an exact quarter where available
          (202503 = Q1).
        pattern: ^\d{4}(03|06|09|12)?$
      indicator:
        type: string
        in: local
        description: Official C&SD statistical variable code; units remain in svDesc. Filter measure separately for
          levels and changes.
        enum:
          - CRASA
      component:
        type: string
        in: local
        description: "BOP_COMPONENT source codes: CRAC = Credit; CRAD = Debit; GC = Credit; GD = Debit; PYINC =
          Credit; PYIND = Debit; SC = Credit; SD = Debit; SIC = Credit; SID = Debit"
        enum:
          - CRAC
          - CRAD
          - GC
          - GD
          - PYINC
          - PYIND
          - SC
          - SD
          - SIC
          - SID
      measure:
        type: string
        in: local
        description: level = HK$ million; yoy = year-on-year percent change; ratio = percent of GDP; qoq = seasonally
          adjusted quarter-to-quarter percent change. Original localized units are preserved in svDesc.
        enum:
          - qoq
      limit:
        type: integer
        in: local
        description: Maximum observations per page.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Observation offset after filtering; continue with nextOffset.
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        enum:
          - en
          - tc
          - sc
        default: en
        description: Language for official title, component descriptions, units and notes.

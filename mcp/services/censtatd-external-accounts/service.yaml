id: censtatd-external-accounts
title: Hong Kong External Income & Balance of Payments
description: Official C&SD Finance tables for external primary income flows by income and country, real income
  flows, disposable national income, rest of world accounts and balance of payments.
apis:
  - API-0551
  - API-0552
  - API-0553
  - API-0554
  - API-0555
  - API-0556
  - API-0557
  - API-0558
  - API-0559
  - API-0560
datasets:
  - hk-censtatd-tablechart-310-36202
  - hk-censtatd-tablechart-310-36203
  - hk-censtatd-tablechart-310-36204
  - hk-censtatd-tablechart-310-36205
  - hk-censtatd-tablechart-310-37011
  - hk-censtatd-tablechart-315-37001
  - hk-censtatd-tablechart-315-37002
  - hk-censtatd-tablechart-315-37003
  - hk-censtatd-tablechart-315-37004
  - hk-censtatd-tablechart-315-37005
baseUrl: https://www.censtatd.gov.hk/api
lang:
  param: lang
  map:
    en: en
    tc: tc
    sc: sc
cacheTtl: 3600
tools:
  - name: epif_income_components
    title: External primary income flows (EPIF) by income component at current market prices (310-36202)
    description: External primary income flows (EPIF) by income component at current market prices. Official C&SD
      Table 310-36202. Newest periods first; page with nextOffset. Preserve original units, figures, missing
      values and revision flags. Components include overlapping totals and children; do not sum them. Filter
      inflow, outflow and net flow separately; do not sum them.
    path: /get.php
    query:
      id: 310-36202
      full_series: 1
    transform:
      response: normalizeExternalAccounts
    input:
      freq:
        type: string
        in: local
        description: "Observation frequency: Y annual, Q quarterly where available."
        enum:
          - Q
          - Y
      period:
        type: string
        in: local
        description: Four-digit year (matches all observations in that year), or an exact quarter where available
          (202503 = Q1).
        pattern: ^\d{4}(03|06|09|12)?$
      indicator:
        type: string
        in: local
        description: Official C&SD statistical variable code; units remain in svDesc. Filter measure separately for
          levels and changes.
        enum:
          - CUREPIF
      component:
        type: string
        in: local
        description: "INC_CPNT source codes: TOTAL = Total; CEI = Compensation of employees; DIInvIncI = Direct
          investment income; OIInvIncI = Other investment income; PIInvIncI = Portfolio investment income;
          RAInvIncI = Income on reserve assets; CEO = Compensation of employees; DIInvIncO = Direct investment
          income; OIInvIncO = Other investment income; PIInvIncO = Portfolio investment income"
        enum:
          - CEI
          - CEO
          - DIInvIncI
          - DIInvIncO
          - OIInvIncI
          - OIInvIncO
          - PIInvIncI
          - PIInvIncO
          - RAInvIncI
          - TOTAL
      measure:
        type: string
        in: local
        description: level = HK$ million; yoy = year-on-year percent change; ratio = percent of GDP; qoq = seasonally
          adjusted quarter-to-quarter percent change. Original localized units are preserved in svDesc.
        enum:
          - level
          - yoy
      limit:
        type: integer
        in: local
        description: Maximum observations per page.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Observation offset after filtering; continue with nextOffset.
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        enum:
          - en
          - tc
          - sc
        default: en
        description: Language for official title, component descriptions, units and notes.
      flow:
        type: string
        in: local
        enum:
          - EPIFI
          - EPIFN
          - EPIFO
        description: EPIFI = Inflow; EPIFO = Outflow; EPIFN = Net flow. Original FLOWS and FLOWSDesc are preserved.

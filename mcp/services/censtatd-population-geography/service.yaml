    {
      "name": "census_2021_major_housing_estates",
      "title": "2021 Population Census (Statistics and Boundaries of Major Housing Estates)",
      "description": "2021 Population Census (Statistics and Boundaries of Major Housing Estates). Original measure field codes, units, nulls, numeric strings and suppression markers (-) are preserved. Consult the official catalogue data dictionary to interpret fields; Shape__Area/Shape__Length retain projected source units. lang selects only the bilingual name alias. Query by objectId or WGS84 intersection bbox; continue with nextOffset and identical filters. At most 100 records and 100 KB per page. Geometry is opt-in; polygons over 20 KB are explicitly omitted, with complete geometry at meta.source. Historical 2021 Census figures. Source: https://data.gov.hk/en-data/dataset/hk-censtatd-census_geo-2021-population-census-by-mhe",
      "path": "/server/rest/services/common/censtatd_rcd_1695182015782_79001/FeatureServer/0/query",
      "query": {
        "f": "json",
        "where": "1=1",
        "outFields": "*",
        "outSR": 4326,
        "orderByFields": "OBJECTID ASC",
        "geometryPrecision": 6
      },
      "input": {
        "objectId": {
          "type": "integer",
          "minimum": 1,
          "maximum": 2147483647,
          "in": "local"
        },
        "bbox": {
          "type": "string",
          "pattern": "^-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?$",
          "in": "local",
          "description": "WGS84 west,south,east,north; polygon intersection."
        },
        "geometry": {
          "type": "boolean",
          "default": false,
          "name": "returnGeometry"
        },
        "lang": {
          "type": "string",
          "enum": [
            "en",
            "tc"
          ],
          "default": "en",
          "in": "local",
          "description": "Name alias only. Source publishes English and Traditional Chinese; no Simplified Chinese variant."
        },
        "limit": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 10,
          "name": "resultRecordCount"
        },
        "offset": {
          "type": "integer",
          "minimum": 0,
          "maximum": 1000000,
          "default": 0,
          "name": "resultOffset"
        }
      },
      "transform": {
        "request": "request0224",
        "response": "response0224"
      },
      "response": {
        "format": "json"
      },
      "timeoutMs": 30000
    },

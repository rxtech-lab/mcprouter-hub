id: mtr
title: MTR
description: Next train schedules for MTR heavy rail lines and Light Rail. MTR Bus arrivals are in the Buses, Minibuses & Trams service.
# Entries in mcp/apis.yaml this service implements.
apis: [API-0014, API-0015]
datasets:
  - mtr-data2-nexttrain-data
  - mtr-lrnt_data-light-rail-nexttrain-data
baseUrl: https://rt.data.gov.hk/v1/transport/mtr
lang:
  param: lang
  map: { en: EN, tc: TC, sc: TC }
cacheTtl: 30
# Renders results in hosts that support MCP Apps; see app.ts.
app: {}
tools:
  - name: mtr_next_train
    title: MTR next trains
    description: "Next train arrival times at an MTR station on one line, in both directions (UP and DOWN). Line codes: AEL, TCL, TML, TKL, EAL, SIL, TWL, ISL, KTL, DRL. Station codes are three letters, e.g. TUM (Tuen Mun), ADM (Admiralty), HOK (Hong Kong)."
    path: /getSchedule.php
    input:
      line: { type: string, required: true, transform: upper, description: "MTR line code, e.g. TML or ISL" }
      sta: { type: string, required: true, transform: upper, description: "Three-letter station code on that line, e.g. TUM" }
      lang: { type: string, enum: [en, tc, sc], default: en, description: "Response language" }
  - name: mtr_light_rail_schedule
    title: Light Rail next trains
    description: Next Light Rail trains at a stop, by platform, with route number, destination and minutes to arrival.
    path: /lrt/getSchedule
    input:
      stationId: { type: string, required: true, name: station_id, description: "Light Rail stop id, e.g. 100 for Tuen Mun Ferry Pier, 295 for Tuen Mun" }

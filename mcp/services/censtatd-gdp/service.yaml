id: censtatd-gdp
title: Hong Kong GDP & Consumption Statistics
description: Official C&SD Finance tables for GDP, real growth, expenditure, contributions, deflators, seasonally adjusted GDP and private consumption expenditure.
apis: [API-0521, API-0522, API-0523, API-0524, API-0525, API-0526, API-0527, API-0528, API-0529, API-0530]
datasets:
  - hk-censtatd-tablechart-310-30001
  - hk-censtatd-tablechart-310-31001
  - hk-censtatd-tablechart-310-31002
  - hk-censtatd-tablechart-310-31003
  - hk-censtatd-tablechart-310-31004
  - hk-censtatd-tablechart-310-31005
  - hk-censtatd-tablechart-310-31006
  - hk-censtatd-tablechart-310-31007
  - hk-censtatd-tablechart-310-31011
  - hk-censtatd-tablechart-310-31012
baseUrl: https://www.censtatd.gov.hk/api
lang:
  param: lang
  map: { en: en, tc: tc, sc: sc }
cacheTtl: 3600
tools:
  - name: gdp_real_growth
    title: "Percentage change of Gross Domestic Product (GDP) and selected major expenditure components in real terms (310-30001)"
    description: "Percentage change of Gross Domestic Product (GDP) and selected major expenditure components in real terms. Official C&SD Table 310-30001. Newest periods first; use offset to page through history. Figures retain original units, missing-value and revision flags. Filter measure to distinguish levels from growth rates; chained components may not add to GDP. GDP quarter codes end in 03, 06, 09 or 12."
    path: /get.php
    query: { id: "310-30001", full_series: 1 }
    transform: { response: normalizeGdpTable }
    input:
      freq:
        type: string
        in: local
        description: "Observation frequency: Y annual, Q quarterly."
        enum: ["Q", "Y"]
      period:
        type: string
        in: local
        description: "Filter a year (2025) or exact quarter (202503 = Q1). Annual-only tables accept years."
        pattern: '^\d{4}(03|06|09|12)?$'
      indicator:
        type: string
        in: local
        description: "C&SD indicator: CUR current prices, CON chained dollars, DEF deflator, CURPGDP/CONPGDP per capita, SA1 seasonally adjusted GDP, SA_DEF seasonally adjusted GDP deflator."
        enum: ["CON", "SA1"]
      component:
        type: string
        in: local
        description: "Expenditure component: TOTAL = Total GDP; GCE = Government consumption expenditure; GDFCF = Gross domestic fixed capital formation; MG = Imports of goods (f.o.b.); MS = Imports of services; PCE = Private consumption expenditure; XG = Exports of goods (f.o.b.); XS = Exports of services. TOTAL means total GDP."
        enum: ["GCE", "GDFCF", "MG", "MS", "PCE", "TOTAL", "XG", "XS"]
      measure:
        type: string
        in: local
        description: "level = monetary value or index; yoy = year-on-year change; qoq = quarter-to-quarter change; contribution = percentage points; ratio = percent of GDP."
        enum: ["qoq", "yoy"]
      limit:
        type: integer
        in: local
        description: "Maximum observations per page."
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: "Observation offset after filtering; continue with nextOffset."
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        enum: [en, tc, sc]
        default: en
        description: Language for the official title, units, component descriptions and notes.

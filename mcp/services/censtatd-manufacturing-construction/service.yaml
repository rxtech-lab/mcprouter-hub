id: censtatd-manufacturing-construction
title: Hong Kong Manufacturing and Construction Costs
description: Official C&SD manufacturing principal statistics, mining and quarry production, and construction labour and materials cost indices.
apis:
  - API-0667
  - API-0668
  - API-0669
  - API-0670
  - API-0671
  - API-0672
  - API-0673
  - API-0674
  - API-0675
  - API-0676
datasets:
  - hk-censtatd-tablechart-610-72003
  - hk-censtatd-tablechart-610-72004
  - hk-censtatd-tablechart-610-72005
  - hk-censtatd-tablechart-610-72006
  - hk-censtatd-tablechart-610-72013
  - hk-censtatd-tablechart-610-92091
  - hk-censtatd-tablechart-615-21001
  - hk-censtatd-tablechart-615-21001a
  - hk-censtatd-tablechart-615-21002
  - hk-censtatd-tablechart-615-21002a
baseUrl: https://www.censtatd.gov.hk/api
lang:
  param: lang
  map: { en: en, tc: tc, sc: sc }
cacheTtl: 3600
tools:
  - name: manufacturing_by_value_added
    title: "Principal statistics for all companies in the manufacturing sector by industry value added (610-72003)"
    description: "Principal statistics for all companies in the manufacturing sector by industry value added. Official C&SD Table 610-72003. Newest observations first; use nextOffset with the same filters. Figures, units, missing values and flags are preserved. Do not add overlapping groups or compare indices with different base periods. HC counts companies; PE_ASEA counts persons engaged where present."
    path: /get.php
    query: { id: "610-72003", full_series: 1 }
    transform: { response: normalizeManufacturingConstruction }
    input:
      period:
        type: string
        in: local
        description: "Provider year YYYY or exact month YYYYMM where supported; a year selects all its observations."
        pattern: "^\\d{4}$"
      freq:
        type: string
        in: local
        description: "Provider frequency: Y annual; M monthly. Do not combine annual and monthly values."
        enum: ["Y"]
      indicator:
        type: string
        in: local
        description: "Original statistical variable code. Source units are preserved without conversion."
        enum: ["COMP", "GS", "HC", "IVA", "OE", "PE_ASEA", "TR"]
      value_added_group:
        type: string
        in: local
        description: "IVA_GRP: TOTAL = Total; 1000-2499 = 1,000 - 2,499; 10000-24999 = 10,000 - 24,999; 250-499 = 250 - 499; 2500-4999 = 2,500 - 4,999; 25000_and_over = ≥ 25,000; 50-249 = 50 - 249; 500-999 = 500 - 999; 5000-9999 = 5,000 - 9,999; <50 = < 50"
        enum: ["TOTAL", "1000-2499", "10000-24999", "250-499", "2500-4999", "25000_and_over", "50-249", "500-999", "5000-9999", "<50"]
      industry:
        type: string
        in: local
        description: "IND: ind_ASIP_C = Manufacturing"
        enum: ["ind_ASIP_C"]
      measure:
        type: string
        in: local
        description: "Source unit category; monetary values are HK$ million, counts retain their indicator meaning."
        enum: ["hkd_million", "number"]
      limit: { type: integer, in: local, description: Maximum observations returned per page., default: 50, minimum: 1, maximum: 100 }
      offset: { type: integer, in: local, description: Offset after filtering; continue with nextOffset., default: 0, minimum: 0, maximum: 100000 }
      lang:
        type: string
        description: Language of official title, notes, source and dimension labels.
        enum: [en, tc, sc]
        default: en

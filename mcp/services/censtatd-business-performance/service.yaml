id: censtatd-business-performance
title: Hong Kong Information, Finance & Business Performance
description: Official C&SD annual business statistics for information and communications, financing,
  professional and business services, banking and insurance, with industry, employment, receipts and
  value-added groups.
apis:
  - API-0730
  - API-0731
  - API-0733
  - API-0734
  - API-0735
  - API-0736
  - API-0737
  - API-0738
  - API-0739
  - API-0740
datasets:
  - hk-censtatd-tablechart-640-75103
  - hk-censtatd-tablechart-640-75104
  - hk-censtatd-tablechart-645-75001
  - hk-censtatd-tablechart-645-75002
  - hk-censtatd-tablechart-645-75003
  - hk-censtatd-tablechart-645-75004
  - hk-censtatd-tablechart-645-75011
  - hk-censtatd-tablechart-645-75012
  - hk-censtatd-tablechart-645-75013
  - hk-censtatd-tablechart-645-75020
baseUrl: https://www.censtatd.gov.hk/api
lang:
  param: lang
  map:
    en: en
    tc: tc
    sc: sc
cacheTtl: 3600
tools:
  - name: information_communications_by_receipts
    title: Principal statistics for all companies in the information and communications sector by
      industry grouping and total receipts (640-75103)
    description: Principal statistics for all companies in the information and communications sector by
      industry grouping and total receipts. Official C&SD table 640-75103. Newest years first;
      paginate with nextOffset. Preserve source units, rounding, subsidy notes, suppression and
      revision flags. Totals and subgroups overlap; do not sum. Empty figures are not zero. Group
      units and boundaries differ between tables.
    path: /get.php
    query:
      id: 640-75103
      full_series: 1
    transform:
      response: normalizeBusinessPerformance
    input:
      freq:
        type: string
        in: local
        description: Official annual frequency.
        enum:
          - Y
      period:
        type: string
        in: local
        description: Exact four-digit official year.
        pattern: ^\d{4}$
      indicator:
        type: string
        in: local
        description: "Official variables: COMP = Compensation of employees; COST_SOLD = Cost of goods sold;
          HC = Number of companies; IVA = Industry value added; OE = Operating expenses; PE_ASEA =
          Number of persons engaged; TR = Total receipts. Preserve original units and flags."
        enum:
          - COMP
          - COST_SOLD
          - HC
          - IVA
          - OE
          - PE_ASEA
          - TR
      measure:
        type: string
        in: local
        description: "Original units: HK$ million, number or year-on-year percent change. No conversion or
          aggregation."
        enum:
          - hkd_million
          - number
      industry:
        type: string
        in: local
        description: "Industry Grouping. Official IND codes and labels: ind_ASSB_58_59_60 = Publishing
          activities; motion picture, video and television programme production, sound recording and
          music publishing activities; and programming and broadcasting activities; ind_ASSB_61 =
          Telecommunications; ind_ASSB_62_63 = Information technology service activities and
          information service activities; ind_ASSB_J = Information and communications."
        enum:
          - ind_ASSB_58_59_60
          - ind_ASSB_61
          - ind_ASSB_62_63
          - ind_ASSB_J
      receipts_group:
        type: string
        in: local
        description: "Total Receipts (HK$ thousand). Official TR_GRP codes and labels: TOTAL = Total;
          1000-4999 = 1,000 - 4,999; 10000-19999 = 10,000 - 19,999; 20000-49999 = 20,000 - 49,999;
          5000-9999 = 5,000 - 9,999; 50000_and_over = ≥ 50,000; <1000 = < 1,000."
        enum:
          - TOTAL
          - 1000-4999
          - 10000-19999
          - 20000-49999
          - 5000-9999
          - 50000_and_over
          - <1000
      limit:
        type: integer
        in: local
        description: Maximum observations per page; also bounded to 100 KB.
        default: 50
        minimum: 1
        maximum: 100
      offset:
        type: integer
        in: local
        description: Continue with nextOffset and the same filters and language.
        default: 0
        minimum: 0
        maximum: 100000
      lang:
        type: string
        description: Official title, labels, units and notes language.
        enum:
          - en
          - tc
          - sc
        default: en

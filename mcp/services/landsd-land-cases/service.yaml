    {
      "name": "landsd_land_acquisition_notices",
      "title": "Government Notices and Plans Issued by Lands Department for Land Acquisition and Foreshore and Seabed Reclamation (Since 2 January 2009)",
      "description": "Government Notices and Plans Issued by Lands Department for Land Acquisition and Foreshore and Seabed Reclamation (Since 2 January 2009). Official CSDI structured access to the catalogue GML dataset. All source fields, nulls, dates, links, units and original text are preserved. lang selects only the name alias; this layer publishes a single mixed-language title, with no separate Chinese field. At most 100 records and 100 KB per page. Geometry over 20 KB is explicitly omitted; use meta.source for the complete geometry. Continue with nextOffset and identical filters. Locations represent source case points, not lot boundaries (except acquisition polygons). Shape__Area/Shape__Length retain provider projected units. Historical cases are not current sale offers or legal title evidence.",
      "baseUrl": "https://portal.csdi.gov.hk",
      "path": "/server/rest/services/common/landsd_rcd_1631605302496_6070/FeatureServer/0/query",
      "input": {
        "search": {
          "type": "string",
          "pattern": "^.{1,100}$",
          "in": "local",
          "description": "Substring / SQL LIKE pattern (% and _ are wildcards)."
        },
        "searchField": {
          "type": "string",
          "enum": [
            "Publication_Date",
            "Project_Title",
            "Type_of_Government_Notice",
            "Government_Notice",
            "Related_Gazette_Plan__Note_",
            "Type"
          ],
          "in": "local",
          "description": "Published field; default is localized name."
        },
        "objectId": {
          "type": "integer",
          "minimum": 1,
          "maximum": 2147483647,
          "in": "local"
        },
        "bbox": {
          "type": "string",
          "pattern": "^-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?$",
          "in": "local",
          "description": "WGS84 west,south,east,north; intersection."
        },
        "geometry": {
          "type": "boolean",
          "default": true,
          "name": "returnGeometry"
        },
        "lang": {
          "type": "string",
          "enum": [
            "en"
          ],
          "default": "en",
          "in": "local"
        },
        "limit": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20,
          "name": "resultRecordCount"
        },
        "offset": {
          "type": "integer",
          "minimum": 0,
          "maximum": 1000000,
          "default": 0,
          "name": "resultOffset"
        }
      },
      "query": {
        "f": "json",
        "where": "1=1",
        "outFields": "*",
        "outSR": 4326,
        "orderByFields": "OBJECTID ASC",
        "geometryPrecision": 6
      },
      "transform": {
        "request": "request3085",
        "response": "response3085"
      },
      "response": {
        "format": "json"
      },
      "timeoutMs": 30000
    },

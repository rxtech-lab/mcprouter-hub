      "description": "Daily HKD exchange rates and effective exchange rate indices. Read-only official HKMA JSON with bounded upstream paging and original source fields. datasize is the size of this page, not the whole register. A full page may have a following page; continue with nextOffset until empty. Optional inclusive from/to date range; newest first. Values and nulls retain provider units and meaning; no inferred conversion. Live availability was blocked during batch 035 verification; this tracker entry remains pending.",

      "query": {},
      "input": {
        "limit": {
          "type": "integer",
          "in": "query",
          "default": 20,
          "minimum": 1,
          "maximum": 100,
          "name": "pagesize"
        },
        "offset": {
          "type": "integer",
          "in": "query",
          "default": 0,
          "minimum": 0,
          "maximum": 1000000
        },
        "from": {
          "type": "string",
          "in": "local",
          "pattern": "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$",
          "description": "Inclusive ISO calendar date; both endpoints are optional."
        },
        "to": {
          "type": "string",
          "in": "local",
          "pattern": "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$",
          "description": "Inclusive ISO calendar date; both endpoints are optional."
        }
      },
      "transform": {
        "request": "hkmaRequest",
        "response": "hkmaResponse"
      },
      "response": {
        "format": "json"
      }
    },

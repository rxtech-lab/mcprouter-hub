{
  "id": "hk-address",
  "title": "Hong Kong Address Lookup",
  "description": "Hong Kong Address Lookup",
  "apis": [
    "API-0049"
  ],
  "datasets": [
    "hk-dpo-als_01-als"
  ],
  "cacheTtl": 3600,
  "tools": [
    {
      "name": "hk_address_lookup",
      "title": "Search formatted Hong Kong addresses and coordinates using the official ALS. Source coverage is not exhaustive; results are suggestions with source validation scores, not verified delivery addresses. Both English and Traditional Chinese address elements are preserved; coordinates may be absent. Local pagination over the suggestions returned by ALS, not the entire address register.",
      "description": "Search formatted Hong Kong addresses and coordinates using the official ALS. Source coverage is not exhaustive; results are suggestions with source validation scores, not verified delivery addresses. Both English and Traditional Chinese address elements are preserved; coordinates may be absent. Local pagination over the suggestions returned by ALS, not the entire address register.",
      "path": "/lookup",
      "input": {
        "limit": {
          "type": "integer",
          "in": "local",
          "minimum": 1,
          "maximum": 20,
          "default": 20,
          "description": "Maximum records per page."
        },
        "offset": {
          "type": "integer",
          "in": "local",
          "minimum": 0,
          "maximum": 100000,
          "default": 0,
          "description": "Continue with nextOffset using the same filters."
        },
        "q": {
          "type": "string",
          "required": true,
          "pattern": "^(?=.{1,200}$).*\\S.*$",
          "description": "Hong Kong building name or street number and name; English or Chinese."
        },
        "lang": {
          "type": "string",
          "enum": [
            "en",
            "tc"
          ],
          "default": "en",
          "in": "local",
          "description": "Preferred address label; both original languages are retained."
        }
      },
      "headers": {
        "Accept": "application/json"
      },
      "transform": {
        "response": "normalize"
      }
    }
  ],
  "baseUrl": "https://www.als.gov.hk"
}

id: citybus
title: Citybus
description: Citybus routes, stops and real-time estimated arrival times.
datasets:
  - ctb-eta-transport-realtime-eta
baseUrl: https://rt.data.gov.hk/v2/transport/citybus
cacheTtl: 3600
tools:
  - name: citybus_routes
    title: Citybus routes
    description: List Citybus routes with origin and destination. Filter by route number or by text in the origin or destination.
    path: /route/ctb
    input:
      route: { type: string, in: local, transform: upper, description: "Route number to filter by, e.g. 8 or A21" }
      search: { type: string, in: local, description: "Text to look for in the origin or destination name" }
    response:
      root: data
      filter: { route: route }
      search: { input: search, fields: [orig_en, orig_tc, dest_en, dest_tc] }
      limit: 100
  - name: citybus_stop
    title: Citybus stop details
    description: Name and coordinates of one Citybus stop.
    path: /stop/{stopId}
    cacheTtl: 86400
    input:
      stopId: { type: string, required: true, description: "6-digit Citybus stop id" }
    response:
      root: data
  - name: citybus_route_stops
    title: Stops on a Citybus route
    description: Ordered list of stop ids served by a Citybus route in one direction. Combine with citybus_stop for names.
    path: /route-stop/ctb/{route}/{direction}
    input:
      route: { type: string, required: true, transform: upper, description: "Route number" }
      direction: { type: string, enum: [inbound, outbound], default: outbound, description: "Direction of travel" }
    response:
      root: data
      limit: 150
  - name: citybus_eta
    title: Citybus arrivals
    description: Real-time estimated arrival times of one Citybus route at one stop.
    path: /eta/ctb/{stopId}/{route}
    cacheTtl: 30
    input:
      stopId: { type: string, required: true, description: "6-digit Citybus stop id" }
      route: { type: string, required: true, transform: upper, description: "Route number" }
    response:
      root: data
      pick: [route, dir, seq, dest_en, dest_tc, eta_seq, eta, rmk_en, rmk_tc, data_timestamp]

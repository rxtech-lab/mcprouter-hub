id: fehd-refuse-cameras
title: Illegal Refuse Deposit Blackspots Installed with Internet Protocol Cameras
description: Illegal Refuse Deposit Blackspots Installed with Internet Protocol
  Cameras with structured access to the official CSDI FeatureServer.
apis:
  - API-1903
datasets:
  - hk-fehd-fehdipcam-fehd-ipcamera
cacheTtl: 3600
tools:
  - name: fehd_refuse_camera_blackspots
    title: Illegal Refuse Deposit Blackspots Installed with Internet Protocol Cameras
    description: "Illegal Refuse Deposit Blackspots Installed with Internet Protocol
      Cameras. Query published attributes by one allowlisted searchField, exact
      objectId, or WGS84 bbox. Results bounded to 100 records and 100 KB;
      paginate using nextOffset. Original attributes retained; name follows
      lang. "
    handler: query
    timeoutMs: 30000
    input:
      search:
        type: string
        pattern: ^.{1,100}$
        description: Text in one searchField; SQL LIKE wildcards % and _ are supported
      searchField:
        type: string
        enum:
          - ADDRESS_EN
          - ADDRESS_TC
          - SEARCH01_EN
          - SEARCH01_TC
        description: One published field; defaults to the name in lang
      objectId:
        type: integer
        minimum: 1
        description: Exact source OBJECTID
      bbox:
        type: string
        pattern: ^-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?$
        description: WGS84 west,south,east,north; spatial intersection
      geometry:
        type: boolean
        default: false
        description: Include WGS84 geometry; oversized geometry explicitly omitted
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        description: Maximum records; output also bounded to 100 KB
      offset:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
        description: Continue with nextOffset using identical filters
      lang:
        type: string
        enum:
          - en
          - tc
        default: en
        description: Language of name; original multilingual attributes retained. Only
          published languages are supported

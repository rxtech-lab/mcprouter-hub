id: hko-regional
title: Regional Weather
description: Readings from the Hong Kong Observatory's automatic weather stations across Hong Kong - rainfall in the past hour, temperature, humidity, pressure and wind, the UV index, lightning counts and heat stress.
# Entries in mcp/apis.yaml this service implements.
apis: [API-0030, API-0034, API-0035, API-0037, API-0038]
datasets:
  - hk-hko-rss-rainfall-in-the-past-hour
  - hk-hko-rss-latest-fifteen-minute-mean-uv-index
  - hk-hko-rss-cloud-ground-lightning-count-past-hour
  - hk-hko-rss-latest-one-minute-mean-air-temp
  - hk-hko-rss-latest-one-minute-mean-rh
  - hk-hko-rss-latest-one-minute-mean-sea-level-pressure
  - hk-hko-rss-latest-ten-minute-wind-info
  - hk-hko-rss-hong-kong-heat-index
  - hk-hko-rss-wet-bulb-globe-temperature
baseUrl: https://data.weather.gov.hk/weatherAPI
lang:
  param: lang
  map: { en: en, tc: tc, sc: sc }
cacheTtl: 300
# Renders results in hosts that support MCP Apps; see app.ts.
app: {}
tools:
  - name: hko_rainfall_past_hour
    title: Rainfall in the past hour
    description: Rainfall in millimetres over the past hour at each of the Observatory's automatic weather stations (about 36 across Hong Kong, e.g. Sha Tin, Tuen Mun, Happy Valley), updated every 15 minutes. A station's rainfall is null when its reading is unavailable.
    path: /opendata/hourlyRainfall.php
    transform: { response: hourlyRainfall }
    input:
      station: { type: string, in: local, description: "Only stations whose name or id contains this text, e.g. Sha Tin, 沙田 or RF020" }
      rainingOnly: { type: boolean, in: local, default: false, description: "Only stations that recorded rain in the past hour" }
      lang: { type: string, enum: [en, tc, sc], default: en, description: "Language of the station names" }
  - name: hko_uv_index
    title: UV index
    description: The latest 15-minute mean UV index at King's Park, with its exposure level (low, moderate, high, very high, extreme). It is measured from 7 a.m. to 6 p.m. Hong Kong time; outside those hours the last reading of the day is returned.
    path: /hko_data/regional-weather/latest_15min_uvindex.csv
    transform: { request: regionalCsv, response: uvIndex }
    input:
      lang: { type: string, enum: [en, tc, sc], default: en, description: "Language of the exposure level" }
    response:
      format: csv
  - name: hko_lightning
    title: Lightning count
    description: Number of cloud-to-ground lightning strokes over Hong Kong in the past hour, by region (New Territories West, New Territories East, Hong Kong Island and Kowloon, Lantau), and the totals of cloud-to-ground and cloud-to-cloud lightning over the whole territory.
    path: /opendata/opendata.php
    query: { dataType: LHL, rformat: csv }
    cacheTtl: 600
    transform: { response: lightning }
    input:
      lang: { type: string, enum: [en, tc, sc], default: en, description: "Language of the region names" }
    response:
      format: csv
  - name: hko_regional_weather
    title: Regional weather
    description: Latest readings at each automatic weather station - 1-minute mean air temperature (°C), relative humidity (%) and mean sea level pressure (hPa), and 10-minute mean wind direction, wind speed and maximum gust (km/h). Not every station measures everything; readings a station doesn't report are left out.
    handler: regionalWeather
    # Temperature, humidity and pressure are updated every minute, wind every 10 minutes.
    cacheTtl: 60
    input:
      station: { type: string, description: "Only stations whose name contains this text, e.g. Sha Tin, Chek Lap Kok or 天文台" }
      lang: { type: string, enum: [en, tc, sc], default: en, description: "Language of the station names and wind directions" }
  - name: hko_heat_stress
    title: Heat stress
    description: Latest Hong Kong Heat Index (10-minute mean) and Wet Bulb Globe Temperature (60-minute mean, °C) at the Observatory's heat stress stations (Hong Kong Observatory, King's Park, Sha Tin, Chek Lap Kok and others), updated every minute. Both measure how heat and humidity together stress the body.
    handler: heatStress
    cacheTtl: 60
    input:
      station: { type: string, description: "Only stations whose name contains this text, e.g. Sha Tin or 跑馬地" }
      lang: { type: string, enum: [en, tc, sc], default: en, description: "Language of the station names" }

id: epd-noise-permits
title: Issued Construction Noise Permits
description: Issued Construction Noise Permits from the Environmental Protection Department, with bounded structured
  access to the official source.
apis:
- API-1841
datasets:
- hk-epd-rngteam-issued-construction-noise-permit
cacheTtl: 3600
tools:
- name: epd_construction_noise_permits
  title: Construction noise permits
  description: Issued construction noise permits with permit number, permittee, site, district, issue date and validity
    as published. Issued does not imply currently valid; inspect VALIDITY. Uses the official CSDI ArcGIS query API.
    Results bounded to 100 records and 100 KB; continue with nextOffset. Text search uses one selectable published
    field per request.
  handler: constructionNoisePermits
  input:
    search:
      type: string
      pattern: ^.{1,100}$
      description: 'Text in searchField (default: localized name/address); SQL LIKE wildcards % and _ supported'
    objectId:
      type: integer
      minimum: 1
      description: Exact source OBJECTID
    bbox:
      type: string
      pattern: ^-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?$
      description: WGS84 west,south,east,north; spatial intersection
    geometry:
      type: boolean
      default: false
      description: Include WGS84 geometry; large geometries explicitly omitted
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
      description: Maximum records; output also bounded to 100 KB
    offset:
      type: integer
      minimum: 0
      maximum: 1000000
      default: 0
      description: Continue with nextOffset using identical filters
    lang:
      type: string
      enum:
      - en
      - tc
      default: en
      description: Language of name; source multilingual fields retained. Only published languages supported.
    searchField:
      type: string
      enum:
      - PERMIT_NO
      - PERMITTEE_NAME_ENG
      - PERMITTEE_NAME_CHIN
      - SITE_ADDRESS_ENG
      - SITE_ADDRESS_CHIN
      - DISTRICT_ENG
      - DISTRICT_CHIN
      description: One published field to search; defaults to the name/address in lang. Query fields separately;
        CSDI rejects cross-field OR searches.
  timeoutMs: 30000

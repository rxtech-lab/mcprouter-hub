id: epd-recycling
title: Recyclable Collection Points
description: Recyclable Collection Points from the Environmental Protection Department, with bounded structured
  access to the official source.
apis:
- API-1834
datasets:
- hk-epd-recycteam-waste-less-recyclable-collection-points-data
cacheTtl: 3600
tools:
- name: epd_recyclable_collection_points
  title: Recyclable collection points
  description: Recycling bins and collection points; search address, district code, waste type or collection category.
    Original multilingual contact, opening hours and accessibility fields are retained. Uses the official CSDI ArcGIS
    query API. Results bounded to 100 records and 100 KB; continue with nextOffset. Text search uses one selectable
    published field per request.
  handler: recyclableCollectionPoints
  input:
    search:
      type: string
      pattern: ^.{1,100}$
      description: 'Text in searchField (default: localized name/address); SQL LIKE wildcards % and _ supported'
    objectId:
      type: integer
      minimum: 1
      description: Exact source OBJECTID
    bbox:
      type: string
      pattern: ^-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?,-?[0-9]+(?:[.][0-9]+)?$
      description: WGS84 west,south,east,north; spatial intersection
    geometry:
      type: boolean
      default: false
      description: Include WGS84 geometry; large geometries explicitly omitted
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
      description: Maximum records; output also bounded to 100 KB
    offset:
      type: integer
      minimum: 0
      maximum: 1000000
      default: 0
      description: Continue with nextOffset using identical filters
    lang:
      type: string
      enum:
      - en
      - tc
      - sc
      default: en
      description: Language of name; source multilingual fields retained. Only published languages supported.
    searchField:
      type: string
      enum:
      - address_en
      - address_tc
      - address_sc
      - district_id
      - waste_type
      - legend
      description: One published field to search; defaults to the name/address in lang. Query fields separately;
        CSDI rejects cross-field OR searches.
  timeoutMs: 30000

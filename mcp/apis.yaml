# API tracker: the single source of truth for which upstream APIs mcprouter serves or plans to serve.
#
# - Every entry has a permanent id (API-NNNN). Add new APIs at the end with the next number; never reuse,
#   renumber or reorder ids. Codegen rejects ids that aren't strictly ascending.
# - Status is not written here. An API is implemented when a service YAML lists its id under `apis:`
#   (and its datasets under `datasets:`); otherwise it shows as "Coming soon".
# - Put the id in the pull request that implements it, e.g. `feat(mcp): add AQHI (API-0031)`.
# - `bun run codegen` validates this file and regenerates APIS.md and the website's /sources/apis page.
#
# Fields: id, title, description, provider, category (transport | weather | environment | health | finance |
# places | government), datasets (DATA.GOV.HK CKAN ids), docs (optional; defaults to the first dataset's page).

apis:
  - id: API-0001
    title: DATA.GOV.HK catalogue
    description: Search the CKAN catalogue, read dataset metadata, browse the historical archive and filter CSV resources.
    provider: Digital Policy Office
    category: government
    datasets: [hk-dpo-datagovhk1-open-dataset-list]
    docs: https://data.gov.hk/en/help/api-spec

